<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>₹1 LAKH CHALLENGE – MONO TRACKER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #000; color: #fff; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      line-height: 1.5;
      font-feature-settings: 'tnum';
    }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum'; }

    /* Layout */
    .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }
    .stack > * + * { margin-top: 16px; }
    .stack-sm > * + * { margin-top: 10px; }
    .stack-lg > * + * { margin-top: 24px; }

    /* Header */
    .hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 16px; }
    .hdr h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    .hdr p { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #666; margin-top: 6px; font-weight: 500; }
    .hdr .bal { text-align: right; }
    .hdr .bal small { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #666; margin-bottom: 4px; font-weight: 500; }
    .hdr .bal b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }

    /* Nav */
    .nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav button {
      flex-shrink: 0; background: transparent; border: 1px solid #222;
      color: #888; font-size: 12px; font-weight: 600; padding: 8px 14px;
      border-radius: 8px; cursor: pointer; transition: all 0.15s;
      font-family: inherit; white-space: nowrap;
    }
    .nav button:hover { color: #fff; border-color: #333; }
    .nav button.active { background: #fff; color: #000; border-color: #fff; }

    /* Cards */
    .card {
      background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 14px; padding: 20px;
    }
    .card-tight { padding: 14px; }
    .card-tighter { padding: 12px; }

    /* Typography helpers */
    .label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #666; font-weight: 600; }
    .label-lg { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #888; font-weight: 600; }
    .big { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    .big-lg { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .muted { color: #666; }
    .dim { color: #888; }

    /* Divider */
    .div { height: 1px; background: #1a1a1a; margin: 14px 0; }

    /* Progress bar */
    .bar { height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; }
    .bar > div { height: 100%; background: #fff; border-radius: 3px; transition: width 0.4s ease; }

    /* Grid utilities */
    .row { display: flex; gap: 10px; }
    .row-b { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    @media (max-width: 480px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    /* Stat tiles */
    .stat { background: #000; border: 1px solid #1a1a1a; border-radius: 10px; padding: 12px; }
    .stat .label { display: block; margin-bottom: 6px; }
    .stat b { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }

    /* Matrix grid */
    .m-grid {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 3px;
    }
    .m-box {
      aspect-ratio: 1;
      border-radius: 3px;
      background: #111;
      border: 1px solid #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1;
      padding: 0;
      overflow: hidden;
    }
    @media (min-width: 480px) {
      .m-box { font-size: 10px; border-radius: 4px; }
    }
    .m-box:active { transform: scale(0.92); }
    .m-box.done {
      background: #fff;
      border-color: #fff;
      color: #000;
      font-weight: 700;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 10px; font-family: inherit;
      font-weight: 600; cursor: pointer; transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: #fff; color: #000; padding: 14px 20px; font-size: 14px; width: 100%;
    }
    .btn-primary:hover { background: #e5e5e5; }
    .btn-secondary {
      background: transparent; color: #fff; border: 1px solid #333;
      padding: 10px 16px; font-size: 13px;
    }
    .btn-secondary:hover { border-color: #555; }
    .btn-ghost {
      background: transparent; color: #888; border: 1px solid #1a1a1a;
      padding: 8px 14px; font-size: 12px;
    }
    .btn-ghost:hover { color: #fff; border-color: #333; }
    .btn-danger {
      background: transparent; color: #fff; border: 1px solid #333;
      padding: 10px 16px; font-size: 13px;
    }
    .btn-danger:hover { background: #1a1a1a; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }

    /* Inputs */
    .inp {
      background: #000; border: 1px solid #222; color: #fff;
      padding: 10px 12px; border-radius: 10px; font-family: inherit;
      font-size: 14px; width: 100%; outline: none; transition: border 0.15s;
    }
    .inp:focus { border-color: #666; }
    .inp::placeholder { color: #444; }
    select.inp { appearance: none; cursor: pointer; }
    input[type="date"].inp { color-scheme: dark; }
    input[type="number"].inp { font-family: 'JetBrains Mono', monospace; }

    /* Select pills */
    .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: transparent; border: 1px solid #222; color: #888;
      padding: 7px 14px; border-radius: 8px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .pill:hover { color: #fff; border-color: #444; }
    .pill.active { background: #fff; color: #000; border-color: #fff; }

    /* List rows */
    .list-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #151515; gap: 12px;
    }
    .list-row:last-child { border-bottom: none; }

    /* Calendar */
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; border-radius: 6px;
      background: #0f0f0f; color: #444; font-family: 'JetBrains Mono', monospace;
    }
    .cal-day.done { background: #fff; color: #000; }
    .cal-day.missed { background: #1a1a1a; color: #666; }
    .cal-day.today { outline: 1px solid #fff; outline-offset: -1px; }

    /* Modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: #0a0a0a; border: 1px solid #222; border-radius: 16px;
      width: 100%; max-width: 400px; padding: 24px;
    }
    .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    .modal p { color: #888; font-size: 14px; line-height: 1.5; }

    /* Toast */
    #toasts {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 200; width: 100%; max-width: 360px; padding: 0 16px;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      background: #fff; color: #000; padding: 12px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 600; text-align: center;
      animation: slideUp 0.2s ease-out;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Empty state */
    .empty { text-align: center; padding: 32px 16px; color: #555; font-size: 13px; }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 6px; font-size: 10px;
      font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      border: 1px solid #222; color: #888;
    }
    .badge-fill { background: #fff; color: #000; border-color: #fff; }
    .badge-muted { color: #555; }
  </style>
</head>
<body>

<div class="wrap">
  <header class="hdr">
    <div>
      <h1>₹1 LAKH<br>CHALLENGE</h1>
      <p>240 Boxes · Savings Tracker</p>
    </div>
    <div class="bal">
      <small>Matrix</small>
      <b id="headerMatrix" class="mono">₹0</b>
    </div>
  </header>

  <nav class="nav" id="mainNav">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="matrix">Matrix</button>
    <button data-tab="streak">Streak</button>
    <button data-tab="booster">Booster</button>
    <button data-tab="penalty">Penalty</button>
    <button data-tab="activity">Activity</button>
    <button data-tab="reports">Reports</button>
    <button data-tab="coach">Coach</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <main id="tabContent"></main>
</div>

<!-- Modal: Penalty -->
<div id="penaltyModal" class="modal-bg">
  <div class="modal">
    <h3>Missed Streak</h3>
    <p id="penaltyModalText" style="margin-bottom:20px;"></p>
    <div class="row" style="margin-top:20px;">
      <button id="penaltyPayBtn" class="btn btn-primary" style="flex:1;">Mark Paid</button>
      <button id="penaltyLaterBtn" class="btn btn-secondary" style="flex:1;">Later</button>
    </div>
  </div>
</div>

<!-- Modal: Password -->
<div id="passwordModal" class="modal-bg">
  <div class="modal">
    <h3>Unlock Details</h3>
    <p style="margin-bottom:16px;">Enter password to view financial details.</p>
    <input id="passwordInput" type="password" class="inp" placeholder="Password" autocomplete="off" style="margin-bottom:8px;">
    <p id="passwordError" style="display:none; color:#fff; font-size:12px; margin-bottom:12px;">Incorrect password</p>
    <div class="row" style="margin-top:12px;">
      <button id="passwordSubmit" class="btn btn-primary" style="flex:1;">Unlock</button>
      <button id="passwordCancel" class="btn btn-secondary" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<!-- Modal: Confirm -->
<div id="confirmModal" class="modal-bg">
  <div class="modal">
    <h3 id="confirmTitle">Confirm</h3>
    <p id="confirmMessage"></p>
    <div class="row" style="margin-top:20px;">
      <button id="confirmYes" class="btn btn-primary" style="flex:1;">Yes</button>
      <button id="confirmNo" class="btn btn-secondary" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(function() {
  'use strict';

  const DENOMS = [
    { value: 100, count: 20 },
    { value: 200, count: 40 },
    { value: 500, count: 180 }
  ];
  const TOTAL_BOXES = 240;
  const TOTAL_TARGET = 100000;
  const STORAGE_KEY = 'saveChallenge_mono_v1';
  const DEFAULT_PASSWORD = '1234';

  // ---- Hash (timeout-safe) ----
  async function hashPassword(pw) {
    const data = new TextEncoder().encode(pw);
    if (window.crypto && window.crypto.subtle && typeof window.crypto.subtle.digest === 'function') {
      try {
        const subtle = crypto.subtle.digest('SHA-256', data);
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500));
        const buf = await Promise.race([subtle, timeout]);
        return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      } catch (e) { console.warn('subtle fallback:', e.message); }
    }
    let h1 = 0x811c9dc5 >>> 0, h2 = (0x811c9dc5 ^ 0x5bd1e995) >>> 0;
    for (let i = 0; i < data.length; i++) {
      h1 ^= data[i]; h1 = Math.imul(h1, 0x01000193) >>> 0;
      h2 ^= data[i]; h2 = Math.imul(h2, 0x01000193) >>> 0;
      h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0;
    }
    return 'fnv:' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
  }

  const DEFAULT_SETTINGS = {
    startPenalty: 50,
    penaltyIncrement: 50,
    dailyPace: 1,
    challengeStart: new Date().toISOString().slice(0,10),
    targetDate: (() => { const d = new Date(); d.setDate(d.getDate() + 240); return d.toISOString().slice(0,10); })(),
    dashboardPasswordHash: null
  };

  let finUnlocked = false;
  let activePeriod = 'today';
  let currentTab = 'dashboard';
  let confirmCallback = null;

  let state = {
    version: 1,
    boxes: [], boosters: [], penalties: [], missedDates: [],
    settings: { ...DEFAULT_SETTINGS },
    lastPenaltyPopupDate: null
  };

  // ---- Helpers ----
  const todayStr = () => new Date().toISOString().slice(0,10);
  const nowISO = () => new Date().toISOString();
  const fmt = n => '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  function addDays(ds, n) {
    const d = new Date(ds + 'T00:00:00');
    if (isNaN(d)) return 'Invalid';
    d.setDate(d.getDate() + n);
    if (isNaN(d)) return 'Invalid';
    return d.toISOString().slice(0,10);
  }
  function daysBetween(a, b) {
    const d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
    if (isNaN(d1) || isNaN(d2)) return 0;
    return Math.round((d2 - d1) / 86400000);
  }
  const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00'));

  function initBoxes() {
    const arr = [];
    let id = 0;
    DENOMS.forEach(d => {
      for (let i = 0; i < d.count; i++) arr.push({ id: id++, value: d.value, completed: false, timestamp: null });
    });
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---- Load/Save ----
  async function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.version === 1 && Array.isArray(p.boxes) && p.boxes.length === TOTAL_BOXES) {
          state = p;
          state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
          if (!state.settings.dailyPace) state.settings.dailyPace = 1;
          if (!state.settings.targetDate) state.settings.targetDate = DEFAULT_SETTINGS.targetDate;
          ['boosters','penalties','missedDates'].forEach(k => { if (!Array.isArray(state[k])) state[k] = []; });
          if (state.settings.dashboardPassword && !state.settings.dashboardPasswordHash) {
            state.settings.dashboardPasswordHash = await hashPassword(state.settings.dashboardPassword);
            delete state.settings.dashboardPassword;
            saveState();
          }
          delete state.settings.dashboardPassword;
          return;
        }
      }
    } catch (e) { console.warn('load:', e); }
    state.boxes = initBoxes();
    state.boosters = []; state.penalties = []; state.missedDates = [];
    state.settings = { ...DEFAULT_SETTINGS };
    state.settings.dashboardPasswordHash = await hashPassword(DEFAULT_PASSWORD);
    saveState();
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function reconcileMissedDays() {
    const start = state.settings.challengeStart, today = todayStr();
    if (!validDate(start) || start > today) return;
    const missed = [];
    let d = start, guard = 0;
    while (d < today) {
      if (++guard > 5000) break;
      if (!state.boxes.some(b => b.completed && b.timestamp && b.timestamp.slice(0,10) === d)) missed.push(d);
      d = addDays(d, 1);
      if (!validDate(d)) break;
    }
    const existing = new Set(state.penalties.map(p => p.date));
    const added = [];
    missed.forEach(md => {
      if (!existing.has(md)) {
        let cons = 0, chk = md, g = 0;
        while (missed.includes(chk) && ++g < 5000) { cons++; chk = addDays(chk, -1); if (!validDate(chk)) break; }
        added.push({ id: uid(), date: md, amount: state.settings.startPenalty + (cons - 1) * state.settings.penaltyIncrement, paid: false, paidDate: null, timestamp: nowISO() });
      }
    });
    if (added.length) state.penalties.push(...added);
    state.missedDates = missed;
    saveState();
  }

  // ---- Getters ----
  const matrixSaved = () => state.boxes.filter(b => b.completed).reduce((s,b) => s + b.value, 0);
  const matrixDone = () => state.boxes.filter(b => b.completed).length;
  const boostersTotal = () => state.boosters.reduce((s,b) => s + b.amount, 0);
  const penaltiesGen = () => state.penalties.reduce((s,p) => s + p.amount, 0);
  const penaltiesPaid = () => state.penalties.filter(p => p.paid).reduce((s,p) => s + p.amount, 0);
  const outstanding = () => penaltiesGen() - penaltiesPaid();
  const todayDone = () => {
    const t = todayStr();
    return state.boxes.filter(b => b.completed && b.timestamp && b.timestamp.slice(0,10) === t).length;
  };
  const pace = () => state.settings.dailyPace || 1;
  const nextBox = () => state.boxes.find(b => !b.completed) || null;
  const completedList = () => state.boxes.filter(b => b.completed && b.timestamp).sort((a,b) => a.timestamp.localeCompare(b.timestamp));

  function getStreak() {
    const dates = new Set(state.boxes.filter(b => b.completed && b.timestamp).map(b => b.timestamp.slice(0,10)));
    const sorted = Array.from(dates).sort();
    let cur = 0, best = 0, run = 0, prev = null;
    let chk = dates.has(todayStr()) ? todayStr() : addDays(todayStr(), -1);
    while (dates.has(chk)) { cur++; chk = addDays(chk, -1); if (!validDate(chk)) break; }
    sorted.forEach(d => {
      if (prev) run = (daysBetween(prev, d) === 1) ? run + 1 : 1;
      else run = 1;
      if (run > best) best = run;
      prev = d;
    });
    return { current: cur, best, total: dates.size, dates: sorted };
  }

  function getCountdown() {
    const today = todayStr();
    const target = validDate(state.settings.targetDate) ? state.settings.targetDate : DEFAULT_SETTINGS.targetDate;
    const daysLeft = daysBetween(today, target);
    const remBoxes = TOTAL_BOXES - matrixDone();
    const remAmount = TOTAL_TARGET - matrixSaved();
    let reqPace = 0;
    if (daysLeft > 0 && remBoxes > 0) reqPace = remBoxes / daysLeft;
    else if (remBoxes > 0) reqPace = Infinity;
    const start = validDate(state.settings.challengeStart) ? state.settings.challengeStart : today;
    const totalDays = Math.max(1, daysBetween(start, target));
    const elapsed = Math.max(0, Math.min(totalDays, daysBetween(start, today)));
    const expected = Math.floor((elapsed / totalDays) * TOTAL_BOXES);
    const delta = matrixDone() - expected;
    let status = 'on-track';
    if (daysLeft < 0 && remBoxes > 0) status = 'overdue';
    else if (delta >= 5) status = 'ahead';
    else if (delta <= -5) status = 'behind';
    const reqSavings = (daysLeft > 0 && remAmount > 0) ? Math.ceil(remAmount / daysLeft) : 0;
    let projected = null;
    if (remBoxes > 0 && pace() > 0) projected = addDays(today, Math.ceil(remBoxes / pace()));
    else if (remBoxes === 0) projected = today;
    return { daysLeft, target, remBoxes, remAmount, reqPace, reqSavings, delta, status, projected };
  }

  function periodRange(p) {
    const t = todayStr();
    if (p === 'today') return { from: t, to: t };
    if (p === 'week') {
      const d = new Date(), day = d.getDay();
      const s = new Date(d); s.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      return { from: s.toISOString().slice(0,10), to: t };
    }
    if (p === 'month') {
      const s = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      return { from: s.toISOString().slice(0,10), to: t };
    }
    return { from: state.settings.challengeStart || t, to: t };
  }

  function breakdown(from, to) {
    let matrix = 0, mB = 0, boost = 0, bC = 0, pPaid = 0, pPaidC = 0, pGen = 0, pGenC = 0;
    state.boxes.forEach(b => {
      if (b.completed && b.timestamp) {
        const d = b.timestamp.slice(0,10);
        if (d >= from && d <= to) { matrix += b.value; mB++; }
      }
    });
    state.boosters.forEach(b => { if (b.date >= from && b.date <= to) { boost += b.amount; bC++; } });
    state.penalties.forEach(p => {
      if (p.date >= from && p.date <= to) { pGen += p.amount; pGenC++; }
      if (p.paid && p.paidDate && p.paidDate >= from && p.paidDate <= to) { pPaid += p.amount; pPaidC++; }
    });
    return { matrix, mB, boost, bC, pPaid, pPaidC, pGen, pGenC, total: matrix + boost + pPaid };
  }

  // ---- Toast ----
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2400);
  }

  // ---- Confirm ----
  function confirmBox(title, msg, onYes) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = msg;
    document.getElementById('confirmModal').classList.add('show');
    confirmCallback = onYes;
    document.getElementById('confirmYes').onclick = () => {
      document.getElementById('confirmModal').classList.remove('show');
      if (confirmCallback) confirmCallback();
      confirmCallback = null;
    };
    document.getElementById('confirmNo').onclick = () => {
      document.getElementById('confirmModal').classList.remove('show');
      confirmCallback = null;
    };
  }

  // ---- Password modal ----
  async function checkPw(entered) {
    const h = state.settings.dashboardPasswordHash;
    if (h) return (await hashPassword(entered)) === h;
    if (state.settings.dashboardPassword) return entered === state.settings.dashboardPassword;
    return entered === DEFAULT_PASSWORD;
  }
  async function setPw(pw) {
    state.settings.dashboardPasswordHash = await hashPassword(pw);
    delete state.settings.dashboardPassword;
    saveState();
  }
  function passwordModal(onSuccess) {
    const modal = document.getElementById('passwordModal');
    const input = document.getElementById('passwordInput');
    const err = document.getElementById('passwordError');
    input.value = ''; err.style.display = 'none';
    modal.classList.add('show');
    setTimeout(() => input.focus(), 100);
    const submit = async () => {
      if (await checkPw(input.value)) {
        if (!state.settings.dashboardPasswordHash && input.value) await setPw(input.value);
        modal.classList.remove('show');
        onSuccess && onSuccess();
      } else {
        err.style.display = 'block'; input.value = ''; input.focus();
      }
    };
    document.getElementById('passwordSubmit').onclick = submit;
    document.getElementById('passwordCancel').onclick = () => modal.classList.remove('show');
    input.onkeydown = e => { if (e.key === 'Enter') submit(); else if (e.key === 'Escape') modal.classList.remove('show'); };
  }

  // ---- Penalty popup ----
  function checkPenaltyPopup() {
    const t = todayStr();
    if (state.lastPenaltyPopupDate === t) return;
    const unpaid = state.penalties.filter(p => !p.paid);
    if (!unpaid.length) return;
    const latest = unpaid[unpaid.length - 1];
    document.getElementById('penaltyModalText').innerHTML =
      `You missed <b>${latest.date}</b>. Penalty: <b>${fmt(latest.amount)}</b>.`;
    document.getElementById('penaltyModal').classList.add('show');
    state.lastPenaltyPopupDate = t;
    saveState();
    document.getElementById('penaltyPayBtn').onclick = () => {
      latest.paid = true; latest.paidDate = t; saveState();
      document.getElementById('penaltyModal').classList.remove('show');
      toast('Penalty paid: ' + fmt(latest.amount));
      renderTab();
    };
    document.getElementById('penaltyLaterBtn').onclick = () => {
      document.getElementById('penaltyModal').classList.remove('show');
    };
  }

        const r = map.get(d); r.matrix += b.value; r.boxes++;

    state.boosters.forEach(b => {
      if (!map.has(b.date)) map.set(b.date, init());
      map.get(b.date).boost += b.amount;

    state.penalties.forEach(p => {
      if (!map.has(p.date)) map.set(p.date, init());
      map.get(p.date).pGen += p.amount;
      if (p.paid && p.paidDate) {
        if (!map.has(p.paidDate)) map.set(p.paidDate, init());
        map.get(p.paidDate).pPaid += p.amount;

    const m = matrixSaved();

    const tM = state.boxes.filter(b => b.completed && b.timestamp && b.timestamp.slice(0,10) === todayStr()).reduce((s,b) => s + b.value, 0);
    const tB = boostersTotal();
    const tDone = todayDone();
    const p = pace();
    const limit = tDone >= p;
    const c = getCountdown();
    const rp = c.reqPace === Infinity ? '—' : c.reqPace.toFixed(1);

    let msg;
    if (pct >= 100) msg = '🏆 Challenge complete! You saved the full ₹1,00,000.';
    else if (c.status === 'overdue') msg = `Target date passed. ${c.remBoxes} boxes left. Set a new target.`;
    else if (c.status === 'behind') msg = `${Math.abs(c.delta)} boxes behind. Need ${rp}/day to catch up.`;
    else if (limit) msg = `Daily pace hit (${p} boxes). Come back tomorrow.`;
    else if (pct >= 50) msg = `Over halfway. ${fmt(m)} of ${fmt(TOTAL_TARGET)} saved.`;
    else if (out > 0) msg = `${fmt(out)} in outstanding penalties. Settle up when you can.`;
    else if (st.current >= 7) msg = `${st.current}-day streak. Keep going.`;
    else if (tM > 0) msg = `Saved ${fmt(tM)} today. Total: ${fmt(m)}.`;
    else if (st.total > 0) msg = `${c.daysLeft} days left. Try one box today.`;
    else msg = 'Welcome. Start with your first ₹100 box.';

    return `
    <div class="stack">
      <div class="card">
        <div class="label-lg">Coach</div>
        <div style="margin-top:16px; font-size:16px; line-height:1.6; font-weight:500;">${msg}</div>
      </div>
      <div class="card">
        <div class="grid-2">
          <div class="stat"><span class="label">Matrix</span><b class="mono">${fmt(m)}</b></div>
          <div class="stat"><span class="label">Booster</span><b class="mono">${fmt(tB)}</b></div>
          <div class="stat"><span class="label">Streak</span><b class="mono">${st.current}d</b></div>
          <div class="stat"><span class="label">Outstanding</span><b class="mono">${fmt(out)}</b></div>
          <div class="stat"><span class="label">Days Left</span><b class="mono">${c.daysLeft}</b></div>
          <div class="stat"><span class="label">Pace Req.</span><b class="mono">${rp}</b></div>
        </div>
      </div>
    </div>`;
  }

  function renderSettings() {
    const s = state.settings;
    return `
    <div class="stack">
      <div class="card">
        <div class="label-lg" style="margin-bottom:16px;">Penalty</div>
        <div class="stack-sm">
          <div class="row-b">
            <label class="dim" style="font-size:13px;">Starting amount</label>
            <input id="settingStartPenalty" type="number" class="inp mono" style="width:100px; padding:8px 10px; text-align:right;" value="${s.startPenalty}">
          </div>
          <div class="row-b">
            <label class="dim" style="font-size:13px;">Increment per miss</label>
            <input id="settingPenaltyIncrement" type="number" class="inp mono" style="width:100px; padding:8px 10px; text-align:right;" value="${s.penaltyIncrement}">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="label-lg" style="margin-bottom:16px;">Challenge</div>
        <div class="stack-sm">
          <div class="row-b">
            <label class="dim" style="font-size:13px;">Daily pace</label>
            <input id="settingDailyPace" type="number" class="inp mono" style="width:100px; padding:8px 10px; text-align:right;" min="1" max="240" value="${s.dailyPace || 1}">
          </div>
          <div class="row-b">
            <label class="dim" style="font-size:13px;">Start date</label>
            <input id="settingStartDate" type="date" class="inp mono" style="width:160px; padding:8px 10px;" value="${s.challengeStart}">
          </div>
          <div class="row-b">
            <label class="dim" style="font-size:13px;">Target date</label>
            <input id="settingTargetDate" type="date" class="inp mono" style="width:160px; padding:8px 10px;" value="${s.targetDate || DEFAULT_SETTINGS.targetDate}">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="label-lg" style="margin-bottom:6px;">Password</div>
        <p class="dim" style="font-size:12px; margin-bottom:12px;">To change, enter current and new password.</p>
        <div class="stack-sm">
          <input id="settingOldPassword" type="password" class="inp" placeholder="Current password" autocomplete="off">
          <input id="settingNewPassword" type="password" class="inp" placeholder="New password (min 4)" autocomplete="new-password">
          <input id="settingConfirmPassword" type="password" class="inp" placeholder="Confirm new password" autocomplete="new-password">
          <button id="changePasswordBtn" class="btn btn-secondary">Change Password</button>
        </div>
      </div>

      <div class="card">
        <div class="row" style="gap:8px; flex-wrap:wrap;">
          <button id="saveSettingsBtn" class="btn btn-primary" style="flex:1;">Save</button>
          <button id="importDataBtn" class="btn btn-secondary" style="flex:1;">Import</button>
          <button id="resetChallengeBtn" class="btn btn-danger" style="flex:1;">Reset</button>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>`;
  }

  function renderTab() {
    const c = document.getElementById('tabContent');
    switch (currentTab) {
      case 'dashboard': c.innerHTML = renderDashboard(); break;
      case 'matrix': c.innerHTML = renderMatrix(); break;
      case 'streak': c.innerHTML = renderStreak(); break;
      case 'booster': c.innerHTML = renderBooster(); break;
      case 'penalty': c.innerHTML = renderPenalty(); break;
      case 'activity': c.innerHTML = renderActivity(); break;
      case 'reports': c.innerHTML = renderReports(); break;
      case 'coach': c.innerHTML = renderCoach(); break;
      case 'settings': c.innerHTML = renderSettings(); break;
    }
    document.getElementById('headerMatrix').textContent = fmt(matrixSaved());
    bindEvents();
  }

  async function changePassword() {
    const oldPw = document.getElementById('settingOldPassword').value;
    const nwPw = document.getElementById('settingNewPassword').value;
    const cfPw = document.getElementById('settingConfirmPassword').value;
    if (!(await checkPw(oldPw))) return toast('Current password incorrect');
    if (nwPw.length < 4) return toast('Password must be 4+ chars');
    if (nwPw !== cfPw) return toast('Passwords do not match');
    await setPw(nwPw);
    toast('Password changed');
    renderTab();
  }

  function bindEvents() {
    const el = id => document.getElementById(id);

    if (el('unlockFinBtn')) el('unlockFinBtn').onclick = () => passwordModal(() => { finUnlocked = true; toast('Unlocked'); renderTab(); });
    if (el('lockFinBtn')) el('lockFinBtn').onclick = () => { finUnlocked = false; toast('Locked'); renderTab(); };

    document.querySelectorAll('.pill[data-period]').forEach(p => {
      p.onclick = () => { activePeriod = p.dataset.period; renderTab(); };
    });

    if (el('checkNextBtn')) el('checkNextBtn').onclick = () => {
      const nb = nextBox();
      if (!nb) return;
      const p = pace(), t = todayDone();
      if (t >= p) return toast('Daily limit reached');
      nb.completed = true;
      nb.timestamp = nowISO();
      toast(`Saved ${fmt(nb.value)} (${t + 1}/${p})`);
      saveState();
      renderTab();
    };

    document.querySelectorAll('.m-box.done').forEach(b => {
      b.onclick = () => {
        const id = parseInt(b.dataset.boxId, 10);
        const box = state.boxes.find(x => x.id === id);
        if (!box || !box.completed) return;
        confirmBox('Undo', `Uncheck ${fmt(box.value)}?`, () => {
          box.completed = false; box.timestamp = null;
          saveState(); renderTab();
        });
      };
    });

    if (el('paceSelect')) el('paceSelect').onchange = () => {
      const np = parseInt(el('paceSelect').value, 10);
      const t = todayDone();
      if (t > np) { toast(`Already ${t} today`); el('paceSelect').value = pace(); return; }
      state.settings.dailyPace = np;
      saveState();
      toast(`Pace: ${np}/day`);
      renderTab();
    };

    if (el('addBoosterBtn')) el('addBoosterBtn').onclick = () => {
      const amt = parseFloat(el('boosterAmount').value);
      const desc = el('boosterDesc').value.trim();
      if (!amt || amt <= 0) return toast('Invalid amount');
      const now = new Date();
      state.boosters.push({
        id: uid(), amount: Math.round(amt),
        date: now.toISOString().slice(0,10),
        time: now.toTimeString().slice(0,5),
        description: desc, timestamp: nowISO()
      });
      saveState();
      toast(`+${fmt(amt)}`);
      renderTab();
    };

    document.querySelectorAll('.delete-booster').forEach(b => {
      b.onclick = () => {
        confirmBox('Delete', 'Remove this entry?', () => {
          state.boosters = state.boosters.filter(x => x.id !== b.dataset.id);
          saveState(); renderTab();
        });
      };
    });

    document.querySelectorAll('.mark-paid').forEach(b => {
      b.onclick = () => {
        const p = state.penalties.find(x => x.id === b.dataset.id);
        if (p) { p.paid = true; p.paidDate = todayStr(); saveState(); renderTab(); }
      };
    });

    if (el('exportJson')) el('exportJson').onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'savings_backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Exported');
    };
    if (el('exportCsv')) el('exportCsv').onclick = () => {
      let csv = 'Date,Type,Amount,Description\n';
      state.boxes.filter(b => b.completed && b.timestamp).forEach(b => {
        csv += `${b.timestamp.slice(0,10)},Matrix,${b.value},Box\n`;
      });
      state.boosters.forEach(b => { csv += `${b.date},Booster,${b.amount},${b.description || ''}\n`; });
      state.penalties.forEach(p => { csv += `${p.date},Penalty,${p.amount},${p.paid ? 'Paid' : 'Unpaid'}\n`; });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'savings_export.csv';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Exported');
    };

    if (el('saveSettingsBtn')) el('saveSettingsBtn').onclick = () => {
      const sp = parseInt(el('settingStartPenalty').value, 10);
      const pi = parseInt(el('settingPenaltyIncrement').value, 10);
      const dp = parseInt(el('settingDailyPace').value, 10);
      const sd = el('settingStartDate').value;
      const td = el('settingTargetDate').value;
      if (sp > 0) state.settings.startPenalty = sp;
      if (pi > 0) state.settings.penaltyIncrement = pi;
      if (dp > 0) {
        if (todayDone() > dp) return toast(`Can't be below ${todayDone()}`);
        state.settings.dailyPace = dp;
      }
      if (sd && validDate(sd)) state.settings.challengeStart = sd;
      if (td && validDate(td)) state.settings.targetDate = td;
      saveState();
      toast('Saved');
      renderTab();
    };

    if (el('changePasswordBtn')) el('changePasswordBtn').onclick = changePassword;

    if (el('resetChallengeBtn')) el('resetChallengeBtn').onclick = () => {
      confirmBox('Reset', 'Erase all data?', () => {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      });
    };

    if (el('importDataBtn')) el('importDataBtn').onclick = () => el('importFile').click();
    if (el('importFile')) el('importFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = async (ev) => {
        try {
          const p = JSON.parse(ev.target.result);
          if (p.version === 1 && Array.isArray(p.boxes) && p.boxes.length === TOTAL_BOXES) {
            state = p;
            state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
            if (!state.settings.dailyPace) state.settings.dailyPace = 1;
            if (!state.settings.targetDate) state.settings.targetDate = DEFAULT_SETTINGS.targetDate;
            ['boosters','penalties','missedDates'].forEach(k => { if (!Array.isArray(state[k])) state[k] = []; });
            if (!state.settings.dashboardPasswordHash) {
              state.settings.dashboardPasswordHash = await hashPassword(state.settings.dashboardPassword || DEFAULT_PASSWORD);
            }
            delete state.settings.dashboardPassword;
            saveState();
            toast('Imported');
            renderTab();
          } else toast('Invalid file');
        } catch (e) { toast('Invalid JSON'); }
      };
      r.readAsText(file);
    };
  }

  function setupNav() {
    document.querySelectorAll('#mainNav button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#mainNav button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderTab();
      };
    });
  }

  async function boot() {
    await loadState();
    reconcileMissedDays();
    saveState();
    setupNav();
    renderTab();
    setTimeout(checkPenaltyPopup, 800);
  }

  boot();
})();
</script>
</body>
</html>
