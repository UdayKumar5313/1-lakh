<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>₹1 LAKH SAVINGS CHALLENGE – SMART MONEY TRACKER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: #000000; color: #e5e7eb; margin: 0; min-height: 100vh; }
    .glass-card {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 1.5rem;
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.8);
    }
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      gap: 2px;
      width: 100%;
    }
    @media (min-width: 640px) { .matrix-grid { gap: 3px; } }
    @media (min-width: 1024px) { .matrix-grid { gap: 4px; } }
    .matrix-box {
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border-radius: 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 600; font-size: 9px; padding: 1px; line-height: 1;
      border: 1px solid #2a2a2e; background: #1c1c1f; color: #a1a1aa;
      cursor: pointer; aspect-ratio: 1 / 1; min-width: 0; overflow: hidden; text-align: center;
    }
    @media (min-width: 380px) { .matrix-box { font-size: 10px; } }
    @media (min-width: 640px) { .matrix-box { font-size: 12px; border-radius: 6px; padding: 2px; } }
    @media (min-width: 1024px) { .matrix-box { font-size: 13px; } }
    .matrix-box.completed {
      background: #10b981; border-color: #34d399; color: #000;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); font-weight: 700;
      text-decoration: line-through; opacity: 0.9;
    }
    .matrix-box.completed .check { display: block; }
    .matrix-box.locked { opacity: 0.35; cursor: not-allowed; border-color: #1f1f23; }
    .matrix-box:active:not(.locked) { transform: scale(0.9); }
    .check { display: none; font-size: 0.7em; margin-bottom: 0; line-height: 1; }
    .matrix-box .denom-label { font-size: 1em; line-height: 1; white-space: nowrap; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .modal-backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); }
    .toast { animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .progress-bar { transition: width 0.5s ease; }
    .tab-active { background: #1f1f23; color: #10b981; border-bottom: 2px solid #10b981; }
    .tab-btn { transition: all 0.15s; }
    .tab-btn:hover { background: #18181b; }
    .calendar-day { width: 2.2rem; height: 2.2rem; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border-radius: 0.5rem; }
    .calendar-day.active { background: #10b981; color: #000; font-weight: 700; }
    .calendar-day.missed { background: #3f3f46; color: #a1a1aa; }
    .calendar-day.today { outline: 2px solid #f59e0b; }
    .countdown-warn { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); }
    .countdown-ok { background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.3); }
    .countdown-ahead { background: rgba(59,130,246,0.10); border: 1px solid rgba(59,130,246,0.35); }
    .locked-panel { background: repeating-linear-gradient(45deg, #0a0a0a, #0a0a0a 10px, #111 10px, #111 20px); }
    .fin-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #71717a; }
    .fin-stat-value { font-size: 1.05rem; font-weight: 700; }
    .period-tab { padding: 0.35rem 0.75rem; border-radius: 0.5rem; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .period-tab.active { background: #10b981; color: #000; }
    .period-tab:not(.active) { background: #1f1f23; color: #a1a1aa; }
    .period-tab:not(.active):hover { background: #27272a; }
  </style>
</head>
<body class="bg-black text-gray-200 antialiased">

  <div id="app" class="max-w-7xl mx-auto px-3 sm:px-5 py-4 pb-28 sm:pb-24">
    <header class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">₹1 LAKH CHALLENGE</h1>
        <p class="text-xs sm:text-sm text-zinc-400 mt-0.5">SMART MONEY TRACKER · 240 BOXES</p>
      </div>
      <div class="text-right">
        <p class="text-[10px] uppercase tracking-widest text-zinc-500">Matrix Savings</p>
        <p id="headerMatrix" class="text-xl sm:text-2xl font-bold text-emerald-400">₹0</p>
      </div>
    </header>

    <nav class="flex overflow-x-auto gap-1 mb-6 pb-1 scrollbar-hide" id="mainNav">
      <button data-tab="dashboard" class="tab-btn tab-active px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Dashboard</button>
      <button data-tab="matrix" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Savings Matrix</button>
      <button data-tab="streak" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Streak Tracker</button>
      <button data-tab="booster" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Booster Savings</button>
      <button data-tab="penalty" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Penalty Collection</button>
      <button data-tab="activity" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Daily Activity</button>
      <button data-tab="reports" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Financial Reports</button>
      <button data-tab="coach" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">AI Coach</button>
      <button data-tab="settings" class="tab-btn px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap">Settings</button>
    </nav>

    <div id="tabContent" class="space-y-6"></div>
  </div>

  <!-- Penalty popup -->
  <div id="penaltyModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop">
    <div class="glass-card max-w-md w-full p-6 space-y-4">
      <h2 class="text-xl font-bold text-red-400">⚠️ Missed Streak Penalty</h2>
      <p id="penaltyModalText" class="text-sm text-zinc-300"></p>
      <div class="flex gap-3 pt-2">
        <button id="penaltyPayBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl">Pay Now / Mark as Paid</button>
        <button id="penaltyLaterBtn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold py-2.5 rounded-xl">Remind Me Later</button>
      </div>
    </div>
  </div>

  <!-- Password modal -->
  <div id="passwordModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop">
    <div class="glass-card max-w-sm w-full p-6 space-y-4">
      <h2 class="text-lg font-bold text-white">🔒 Unlock Financial Details</h2>
      <p class="text-xs text-zinc-400">Enter your password to view sensitive collection data.</p>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="off"
        class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
      <p id="passwordError" class="text-xs text-red-400 hidden">Incorrect password. Try again.</p>
      <div class="flex gap-3 pt-1">
        <button id="passwordSubmit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-sm">Unlock</button>
        <button id="passwordCancel" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold py-2.5 rounded-xl text-sm">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-20 sm:bottom-6 left-1/2 transform -translate-x-1/2 z-50 w-full max-w-sm px-4 space-y-2"></div>

  <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop">
    <div class="glass-card max-w-sm w-full p-6 space-y-4">
      <h3 id="confirmTitle" class="text-lg font-bold">Confirm</h3>
      <p id="confirmMessage" class="text-sm text-zinc-300"></p>
      <div class="flex gap-3 pt-2">
        <button id="confirmYes" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-semibold py-2 rounded-xl">Yes</button>
        <button id="confirmNo" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold py-2 rounded-xl">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const DENOMS = [
        { value: 100, count: 20 },
        { value: 200, count: 40 },
        { value: 500, count: 180 }
      ];
      const TOTAL_BOXES = 240;
      const TOTAL_TARGET = 100000;

      const denomTotal = DENOMS.reduce((s, d) => s + d.value * d.count, 0);
      const denomCount = DENOMS.reduce((s, d) => s + d.count, 0);
      if (denomTotal !== TOTAL_TARGET || denomCount !== TOTAL_BOXES) {
        document.body.innerHTML = '<div class="p-8 text-red-500 text-center text-xl">⚠️ Denomination error</div>';
        throw new Error('Denomination validation failed');
      }

      const STORAGE_KEY = 'saveChallenge_v1';
      const DEFAULT_PASSWORD = '1234';

      // --- Password hashing with fallback for non-secure contexts (file://) ---
      async function hashPassword(pw) {
        const data = new TextEncoder().encode(pw);
        if (window.crypto && window.crypto.subtle) {
          try {
            const buf = await crypto.subtle.digest('SHA-256', data);
            return 'sha256:' + Array.from(new Uint8Array(buf))
              .map(b => b.toString(16).padStart(2, '0')).join('');
          } catch (e) { /* fall through to fallback */ }
        }
        // Fallback hash (NOT cryptographically secure; used only when subtle unavailable,
        // e.g. opening this file via file://). For real security serve over HTTPS/localhost.
        let h1 = 0x811c9dc5 >>> 0;
        let h2 = (0x811c9dc5 ^ 0x5bd1e995) >>> 0;
        for (let i = 0; i < data.length; i++) {
          h1 ^= data[i]; h1 = Math.imul(h1, 0x01000193) >>> 0;
          h2 ^= data[i]; h2 = Math.imul(h2, 0x01000193) >>> 0;
          h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0;
        }
        return 'fnv:' + h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
      }

      async function checkPassword(entered) {
        const storedHash = state.settings.dashboardPasswordHash;
        const legacyPlain = state.settings.dashboardPassword;
        if (storedHash) {
          const h = await hashPassword(entered);
          return h === storedHash;
        }
        if (legacyPlain) return entered === legacyPlain;
        return entered === DEFAULT_PASSWORD;
      }

      async function setPassword(pw) {
        state.settings.dashboardPasswordHash = await hashPassword(pw);
        delete state.settings.dashboardPassword;
        saveState();
      }

      const DEFAULT_SETTINGS = {
        startPenalty: 50,
        penaltyIncrement: 50,
        dailyGoal: 1,
        dailyPace: 1,
        challengeStart: new Date().toISOString().slice(0,10),
        targetDate: (() => {
          const d = new Date();
          d.setDate(d.getDate() + 240);
          return d.toISOString().slice(0,10);
        })(),
        currency: 'INR',
        notifications: true,
        darkMode: true,
        dashboardPasswordHash: null
      };

      let finUnlocked = false;
      let activePeriod = 'today';

      let state = {
        version: 1,
        boxes: [],
        boosters: [],
        penalties: [],
        missedDates: [],
        settings: { ...DEFAULT_SETTINGS },
        lastPenaltyPopupDate: null
      };

      function todayStr() { return new Date().toISOString().slice(0,10); }
      function nowISO() { return new Date().toISOString(); }
      function formatINR(num) {
        return '₹' + Number(num).toLocaleString('en-IN', { maximumFractionDigits: 0 });
      }
      function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
      function addDays(dateStr, n) {
        const d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + n);
        return d.toISOString().slice(0,10);
      }
      function daysBetween(a, b) {
        const d1 = new Date(a + 'T00:00:00');
        const d2 = new Date(b + 'T00:00:00');
        return Math.round((d2 - d1) / 86400000);
      }
      function startOfWeek(d = new Date()) {
        const day = d.getDay();
        const diff = (day === 0 ? -6 : 1 - day);
        const s = new Date(d);
        s.setDate(s.getDate() + diff);
        return s.toISOString().slice(0,10);
      }
      function startOfMonth(d = new Date()) {
        return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
      }

      function initBoxes() {
        const arr = [];
        let id = 0;
        DENOMS.forEach(d => {
          for (let i = 0; i < d.count; i++) {
            arr.push({ id: id++, value: d.value, completed: false, timestamp: null });
          }
        });
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      async function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.version === 1 && Array.isArray(parsed.boxes) && parsed.boxes.length === TOTAL_BOXES) {
              state = parsed;
              state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
              if (!state.settings.dailyPace) state.settings.dailyPace = 1;
              if (!state.settings.targetDate) state.settings.targetDate = DEFAULT_SETTINGS.targetDate;
              if (!Array.isArray(state.boosters)) state.boosters = [];
              if (!Array.isArray(state.penalties)) state.penalties = [];
              if (!Array.isArray(state.missedDates)) state.missedDates = [];
              // Migrate legacy plaintext password to hash
              if (state.settings.dashboardPassword && !state.settings.dashboardPasswordHash) {
                const h = await hashPassword(state.settings.dashboardPassword);
                state.settings.dashboardPasswordHash = h;
                delete state.settings.dashboardPassword;
                saveState();
              }
              delete state.settings.dashboardPassword;
              return;
            }
          }
        } catch (e) { console.warn('Load error', e); }
        state.boxes = initBoxes();
        state.boosters = [];
        state.penalties = [];
        state.missedDates = [];
        state.settings = { ...DEFAULT_SETTINGS };
        state.lastPenaltyPopupDate = null;
        // First-run: set default password as a hash BEFORE returning (awaited, no race)
        state.settings.dashboardPasswordHash = await hashPassword(DEFAULT_PASSWORD);
        saveState();
      }

      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch (e) { console.warn('Save failed', e); }
      }

      function reconcileMissedDays() {
        const start = state.settings.challengeStart || todayStr();
        const today = todayStr();
        if (start > today) return;
        let missed = [];
        let d = start;
        while (d < today) {
          const dayBoxes = state.boxes.filter(b => b.completed && b.timestamp && b.timestamp.slice(0,10) === d);
          if (dayBoxes.length === 0) missed.push(d);
          d = addDays(d, 1);
        }
        const existingPenaltyDates = new Set(state.penalties.map(p => p.date));
        let newPenalties = [];
        missed.forEach(md => {
          if (!existingPenaltyDates.has(md)) {
            let consecutive = 0;
            let check = md;
            while (missed.includes(check)) {
              consecutive++;
              check = addDays(check, -1);
            }
            const amount = state.settings.startPenalty + (consecutive - 1) * state.settings.penaltyIncrement;
            newPenalties.push({
              id: uid(), date: md, amount: amount, paid: false, paidDate: null, timestamp: nowISO()
            });
          }
        });
        if (newPenalties.length > 0) state.penalties.push(...newPenalties);
        state.missedDates = missed;
        saveState();
      }

      function getMatrixSavings() {
        return state.boxes.filter(b => b.completed).reduce((s, b) => s + b.value, 0);
      }
      function getMatrixBoxesCompleted() { return state.boxes.filter(b => b.completed).length; }
      function getTotalBoosters() { return state.boosters.reduce((s, b) => s + b.amount, 0); }
      function getTotalPenaltiesGenerated() { return state.penalties.reduce((s, p) => s + p.amount, 0); }
      function getTotalPenaltiesPaid() { return state.penalties.filter(p => p.paid).reduce((s, p) => s + p.amount, 0); }
      function getOutstandingPenalties() { return getTotalPenaltiesGenerated() - getTotalPenaltiesPaid(); }
      function getTodayBoxesCompleted() {
        const t = todayStr();
        return state.boxes.filter(b => b.completed && b.timestamp && b.timestamp.slice(0,10) === t).length;
      }
      function getDailyPace() { return state.settings.dailyPace || 1; }
      function isTodayLimitReached() { return getTodayBoxesCompleted() >= getDailyPace(); }
      function getNextBox() { return state.boxes.find(b => !b.completed) || null; }
      function getCompletedBoxesInOrder() {
        return state.boxes.filter(b => b.completed && b.timestamp)
          .sort((a, b) => a.timestamp.localeCompare(b.timestamp));
      }

      function getCollectionBreakdown(fromDate, toDate) {
        let matrix = 0, matrixBoxes = 0;
        let boosters = 0, boosterCount = 0;
        let penaltyPaid = 0, penaltyPaidCount = 0;
        let penaltyGenerated = 0, penaltyGenCount = 0;

        state.boxes.forEach(b => {
          if (b.completed && b.timestamp) {
            const d = b.timestamp.slice(0,10);
            if (d >= fromDate && d <= toDate) { matrix += b.value; matrixBoxes++; }
          }
        });
        state.boosters.forEach(b => {
          if (b.date >= fromDate && b.date <= toDate) { boosters += b.amount; boosterCount++; }
        });
        state.penalties.forEach(p => {
          if (p.date >= fromDate && p.date <= toDate) { penaltyGenerated += p.amount; penaltyGenCount++; }
          if (p.paid && p.paidDate && p.paidDate >= fromDate && p.paidDate <= toDate) {
            penaltyPaid += p.amount; penaltyPaidCount++;
          }
        });

        return {
          matrix, matrixBoxes, boosters, boosterCount,
          penaltyPaid, penaltyPaidCount, penaltyGenerated, penaltyGenCount,
          totalCollected: matrix + boosters + penaltyPaid
        };
      }

      function getPeriodRange(period) {
        const today = todayStr();
        if (period === 'today') return { from: today, to: today };
        if (period === 'week') return { from: startOfWeek(), to: today };
        if (period === 'month') return { from: startOfMonth(), to: today };
        const start = state.settings.challengeStart || today;
        return { from: start, to: today };
      }

      function getCountdownData() {
        const today = todayStr();
        const target = state.settings.targetDate || DEFAULT_SETTINGS.targetDate;
        const daysRemaining = daysBetween(today, target);
        const remainingBoxes = TOTAL_BOXES - getMatrixBoxesCompleted();
        const remainingAmount = TOTAL_TARGET - getMatrixSavings();

        let requiredBoxesPerDay = 0;
        if (daysRemaining > 0 && remainingBoxes > 0) requiredBoxesPerDay = remainingBoxes / daysRemaining;
        else if (remainingBoxes > 0) requiredBoxesPerDay = Infinity;

        const start = state.settings.challengeStart || today;
        const totalDays = Math.max(1, daysBetween(start, target));
        const elapsedDays = Math.max(0, Math.min(totalDays, daysBetween(start, today)));
        const expectedBoxesByNow = Math.floor((elapsedDays / totalDays) * TOTAL_BOXES);
        const actualBoxes = getMatrixBoxesCompleted();
        const boxesDelta = actualBoxes - expectedBoxesByNow;

        let status = 'on-track';
        if (daysRemaining < 0 && remainingBoxes > 0) status = 'overdue';
        else if (boxesDelta >= 5) status = 'ahead';
        else if (boxesDelta <= -5) status = 'behind';

        const requiredDailySavings = (daysRemaining > 0 && remainingAmount > 0)
          ? Math.ceil(remainingAmount / daysRemaining) : 0;

        const currentPace = getDailyPace();
        let projectedCompletionDate = null;
        if (remainingBoxes > 0 && currentPace > 0) {
          projectedCompletionDate = addDays(today, Math.ceil(remainingBoxes / currentPace));
        } else if (remainingBoxes === 0) {
          projectedCompletionDate = today;
        }

        return {
          daysRemaining, targetDate: target, remainingBoxes, remainingAmount,
          requiredBoxesPerDay, requiredDailySavings, expectedBoxesByNow,
          actualBoxes, boxesDelta, status, currentPace, projectedCompletionDate
        };
      }

      function getStreakData() {
        const completedDates = new Set(
          state.boxes.filter(b => b.completed && b.timestamp).map(b => b.timestamp.slice(0,10))
        );
        const sorted = Array.from(completedDates).sort();
        let currentStreak = 0, bestStreak = 0, streak = 0;
        let prevDate = null;
        let d = todayStr();
        let checkDate = completedDates.has(d) ? d : addDays(d, -1);
        while (completedDates.has(checkDate)) { currentStreak++; checkDate = addDays(checkDate, -1); }
        sorted.forEach(date => {
          if (prevDate) streak = (daysBetween(prevDate, date) === 1) ? streak + 1 : 1;
          else streak = 1;
          if (streak > bestStreak) bestStreak = streak;
          prevDate = date;
        });
        return { currentStreak, bestStreak, totalActiveDays: completedDates.size, completedDates: sorted };
      }

      function checkPenaltyPopup() {
        const today = todayStr();
        if (state.lastPenaltyPopupDate === today) return;
        const unpaid = state.penalties.filter(p => !p.paid);
        if (unpaid.length === 0) return;
        const latest = unpaid[unpaid.length - 1];
        const modal = document.getElementById('penaltyModal');
        document.getElementById('penaltyModalText').innerHTML = `
          Hey! You missed your savings streak on <strong>${latest.date}</strong>.<br>
          Your penalty for this missed day is <strong>${formatINR(latest.amount)}</strong>.<br>
          Don't worry. You can get back on track today.<br>
          Have you set aside your penalty amount?
        `;
        modal.classList.remove('hidden'); modal.classList.add('flex');
        state.lastPenaltyPopupDate = today;
        saveState();

        document.getElementById('penaltyPayBtn').onclick = () => {
          latest.paid = true; latest.paidDate = today;
          saveState();
          modal.classList.add('hidden'); modal.classList.remove('flex');
          showToast('Penalty marked as paid: ' + formatINR(latest.amount));
          renderCurrentTab();

      function showToast(msg, type='info') {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        const colors = { info: 'bg-zinc-800 text-white', success: 'bg-emerald-700 text-white', error: 'bg-red-700 text-white', warning: 'bg-amber-700 text-white' };
        el.className = `toast ${colors[type] || colors.info} px-4 py-2.5 rounded-xl text-sm font-medium shadow-lg text-center`;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 2800);
      }

      let confirmCallback = null;
      function showConfirm(title, message, onYes) {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmMessage').textContent = message;
        const modal = document.getElementById('confirmModal');
        modal.classList.remove('hidden'); modal.classList.add('flex');
        confirmCallback = onYes;
        document.getElementById('confirmYes').onclick = () => {
          modal.classList.add('hidden'); modal.classList.remove('flex');
          if (confirmCallback) confirmCallback();
          confirmCallback = null;
        };
        document.getElementById('confirmNo').onclick = () => {
          modal.classList.add('hidden'); modal.classList.remove('flex');
          confirmCallback = null;
        };
      }

      function showPasswordModal(onSuccess) {
        const modal = document.getElementById('passwordModal');
        const input = document.getElementById('passwordInput');
        const err = document.getElementById('passwordError');
        input.value = '';
        err.classList.add('hidden');
        modal.classList.remove('hidden'); modal.classList.add('flex');
        setTimeout(() => input.focus(), 100);

        const submit = async () => {
          const ok = await checkPassword(input.value);
          if (ok) {
            // Auto-migrate legacy plaintext on successful unlock
            if (!state.settings.dashboardPasswordHash && input.value) {
              await setPassword(input.value);
            }
            modal.classList.add('hidden'); modal.classList.remove('flex');
            if (onSuccess) onSuccess();
          } else {
            err.classList.remove('hidden');
            input.value = '';
            input.focus();
          }
        };
        const cancel = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };

        document.getElementById('passwordSubmit').onclick = submit;
        document.getElementById('passwordCancel').onclick = cancel;
        input.onkeydown = (e) => {
          if (e.key === 'Enter') submit();
          else if (e.key === 'Escape') cancel();
        };
      }

                    <span class="text-blue-400 font-semibold">${formatINR(b.amount)}</span>
                    <span class="text-zinc-400 ml-2">${b.description || '—'}</span>
                    <p class="text-[10px] text-zinc-500">${b.date} ${b.time || ''}</p>
                  </div>
                  <button class="delete-booster text-red-400 text-xs hover:text-red-300" data-id="${b.id}">Delete</button>
                </div>
              `).join('')}
          </div>
        </div>`;
      }

      function renderPenalty() {
        const totalGen = getTotalPenaltiesGenerated();
        const totalPaid = getTotalPenaltiesPaid();
        const outstanding = getOutstandingPenalties();
        const missedCount = state.missedDates.length;
        const sorted = [...state.penalties].sort((a,b) => b.date.localeCompare(a.date));
        return `
        <div class="space-y-4">
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="glass-card p-3"><p class="text-[10px] uppercase text-zinc-500">Generated</p><p class="text-lg font-bold text-red-400">${formatINR(totalGen)}</p></div>
            <div class="glass-card p-3"><p class="text-[10px] uppercase text-zinc-500">Paid</p><p class="text-lg font-bold text-red-300">${formatINR(totalPaid)}</p></div>
            <div class="glass-card p-3"><p class="text-[10px] uppercase text-zinc-500">Outstanding</p><p class="text-lg font-bold text-amber-400">${formatINR(outstanding)}</p></div>
            <div class="glass-card p-3"><p class="text-[10px] uppercase text-zinc-500">Missed days</p><p class="text-lg font-bold text-zinc-300">${missedCount}</p></div>
          </div>
          <div class="glass-card p-4">
            <p class="text-xs uppercase tracking-widest text-zinc-500 mb-2">Penalty History</p>
            ${sorted.length === 0 ? '<p class="text-sm text-zinc-500">No penalties generated.</p>' :
              sorted.map(p => `
                <div class="flex justify-between items-center py-2 border-b border-zinc-800 last:border-0 text-sm">
                  <div>
                    <span class="text-red-400 font-semibold">${formatINR(p.amount)}</span>
                    <span class="text-zinc-400 ml-2">${p.date}</span>
                    ${p.paid ? `<span class="text-emerald-400 text-xs ml-2">Paid ${p.paidDate}</span>` : '<span class="text-amber-400 text-xs ml-2">Unpaid</span>'}
                  </div>
                  ${!p.paid ? `<button class="mark-paid text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded-lg" data-id="${p.id}">Mark Paid</button>` : ''}
                </div>
              `).join('')}
          </div>
        </div>`;
      }

      function renderActivity() {
        const dateMap = new Map();
        state.boxes.filter(b => b.completed && b.timestamp).forEach(b => {
          const d = b.timestamp.slice(0,10);
          if (!dateMap.has(d)) dateMap.set(d, { matrix: 0, boxes: 0, boosters: 0, penaltyGen: 0, penaltyPaid: 0 });
          const rec = dateMap.get(d); rec.matrix += b.value; rec.boxes++;
        });
        state.boosters.forEach(b => {
          if (!dateMap.has(b.date)) dateMap.set(b.date, { matrix: 0, boxes: 0, boosters: 0, penaltyGen: 0, penaltyPaid: 0 });
          dateMap.get(b.date).boosters += b.amount;
        });
        state.penalties.forEach(p => {
          if (!dateMap.has(p.date)) dateMap.set(p.date, { matrix: 0, boxes: 0, boosters: 0, penaltyGen: 0, penaltyPaid: 0 });
          dateMap.get(p.date).penaltyGen += p.amount;
          if (p.paid && p.paidDate) {
            if (!dateMap.has(p.paidDate)) dateMap.set(p.paidDate, { matrix: 0, boxes: 0, boosters: 0, penaltyGen: 0, penaltyPaid: 0 });
            dateMap.get(p.paidDate).penaltyPaid += p.amount;
          }
        });
        const sortedDates = Array.from(dateMap.keys()).sort().reverse();
        return `
        <div class="space-y-3">
          <p class="text-xs uppercase tracking-widest text-zinc-500">Daily Activity</p>
          ${sortedDates.length === 0 ? '<p class="text-sm text-zinc-500">No activity yet.</p>' :
            sortedDates.map(d => {
              const r = dateMap.get(d);
              const totalActual = r.matrix + r.boosters;
              return `
                <div class="glass-card p-4 text-sm space-y-1">
                  <div class="flex justify-between font-medium">
                    <span>${new Date(d+'T00:00:00').toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' })}</span>
                    <span class="text-zinc-400">${r.boxes} boxes</span>
                  </div>
                  <div class="grid grid-cols-2 gap-x-4 gap-y-0.5 text-xs text-zinc-400">
                    <span>Matrix: <span class="text-emerald-400">${formatINR(r.matrix)}</span></span>
                    <span>Booster: <span class="text-blue-400">${formatINR(r.boosters)}</span></span>
                    <span>Penalty gen: <span class="text-red-400">${formatINR(r.penaltyGen)}</span></span>
                    <span>Penalty paid: <span class="text-red-300">${formatINR(r.penaltyPaid)}</span></span>
                  </div>
                  <div class="flex justify-between pt-1 border-t border-zinc-800 text-xs">
                    <span class="text-zinc-400">Actual savings: <span class="text-white font-semibold">${formatINR(totalActual)}</span></span>
                    <span class="${r.boxes > 0 ? 'text-emerald-400' : 'text-zinc-500'}">${r.boxes > 0 ? 'Streak active' : 'Missed'}</span>
                  </div>
                </div>
              `;
            }).join('')}
        </div>`;
      }

      function renderReports() {
        const matrix = getMatrixSavings();
        const boosters = getTotalBoosters();
        const actual = matrix + boosters;
        const penaltyGen = getTotalPenaltiesGenerated();
        const penaltyPaid = getTotalPenaltiesPaid();
        const outstanding = getOutstandingPenalties();
        const boxesDone = getMatrixBoxesCompleted();
        const streak = getStreakData();
        const dailyAvg = boxesDone > 0 ? (matrix / Math.max(1, streak.totalActiveDays)) : 0;
        const c = getCountdownData();
        return `
        <div class="space-y-4">
          <div class="glass-card p-5 space-y-2">
            <p class="text-xs uppercase tracking-widest text-zinc-500">Financial Summary</p>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <span class="text-zinc-400">Matrix savings</span><span class="text-emerald-400 font-semibold text-right">${formatINR(matrix)}</span>
              <span class="text-zinc-400">Booster savings</span><span class="text-blue-400 font-semibold text-right">${formatINR(boosters)}</span>
              <span class="text-zinc-400">Actual savings</span><span class="text-white font-bold text-right">${formatINR(actual)}</span>
              <span class="text-zinc-400">Penalties generated</span><span class="text-red-400 text-right">${formatINR(penaltyGen)}</span>
              <span class="text-zinc-400">Penalties paid</span><span class="text-red-300 text-right">${formatINR(penaltyPaid)}</span>
              <span class="text-zinc-400">Outstanding</span><span class="text-amber-400 text-right">${formatINR(outstanding)}</span>
              <span class="text-zinc-400">Boxes completed</span><span class="text-white text-right">${boxesDone} / 240</span>
              <span class="text-zinc-400">Daily average (matrix)</span><span class="text-white text-right">${formatINR(Math.round(dailyAvg))}</span>
            </div>
          </div>
          <div class="glass-card p-5 space-y-2">
            <p class="text-xs uppercase tracking-widest text-zinc-500">Countdown Report</p>
            <div class="grid grid-cols-2 gap-2 text-sm">
              <span class="text-zinc-400">Target date</span><span class="text-white text-right">${new Date(c.targetDate+'T00:00:00').toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })}</span>
              <span class="text-zinc-400">Days remaining</span><span class="${c.daysRemaining < 0 ? 'text-red-400' : 'text-white'} text-right">${c.daysRemaining}</span>
              <span class="text-zinc-400">Required pace</span><span class="text-white text-right">${c.requiredBoxesPerDay === Infinity ? '—' : c.requiredBoxesPerDay.toFixed(2)} boxes/day</span>
              <span class="text-zinc-400">Required ₹/day</span><span class="text-white text-right">${formatINR(Math.round(c.requiredDailySavings))}</span>
              <span class="text-zinc-400">Status</span><span class="${c.status === 'behind' || c.status === 'overdue' ? 'text-red-400' : c.status === 'ahead' ? 'text-blue-400' : 'text-emerald-400'} text-right capitalize">${c.status}</span>
            </div>
          </div>
          <div class="glass-card p-5">
            <p class="text-xs uppercase tracking-widest text-zinc-500 mb-2">Export</p>
            <div class="flex gap-2 flex-wrap">
              <button id="exportJson" class="bg-zinc-800 hover:bg-zinc-700 text-sm px-3 py-2 rounded-xl">Export JSON</button>
              <button id="exportCsv" class="bg-zinc-800 hover:bg-zinc-700 text-sm px-3 py-2 rounded-xl">Export CSV</button>
            </div>
          </div>
        </div>`;
      }

      function renderCoach() {
        const matrix = getMatrixSavings();
        const pct = (matrix / TOTAL_TARGET * 100);
        const streak = getStreakData();
        const outstanding = getOutstandingPenalties();
        const todayMatrix = state.boxes.filter(b => b.completed && b.timestamp && b.timestamp.slice(0,10) === todayStr()).reduce((s,b)=>s+b.value,0);
        const totalBoosters = getTotalBoosters();
        const todayBoxes = getTodayBoxesCompleted();
        const pace = getDailyPace();
        const limitReached = todayBoxes >= pace;
        const c = getCountdownData();
        const reqPace = (c.requiredBoxesPerDay === Infinity) ? '—' : c.requiredBoxesPerDay.toFixed(1);

        let msg = '';
        if (pct >= 100) msg = '🏆 Congratulations! You have completed the ₹1,00,000 challenge!';
        else if (c.status === 'overdue') msg = `⏰ Target date passed with ${c.remainingBoxes} boxes left. Set a new target date.`;
        else if (c.status === 'behind') msg = `⚠️ ${Math.abs(c.boxesDelta)} boxes behind. Need ${reqPace} boxes/day.`;
        else if (limitReached) msg = `✅ Daily pace hit (${pace} boxes). Come back tomorrow!`;
        else if (pct >= 50) msg = `🎉 You've crossed 50%! ${formatINR(matrix)} saved.`;
        else if (outstanding > 0) msg = `You have ${formatINR(outstanding)} in outstanding penalties.`;
        else if (streak.currentStreak >= 7) msg = `🔥 ${streak.currentStreak}-day streak! Keep it up!`;
        else if (todayMatrix > 0) msg = `Excellent! You saved ${formatINR(todayMatrix)} today. Total: ${formatINR(matrix)}.`;
        else if (streak.totalActiveDays > 0) msg = `Good morning! ${c.daysRemaining > 0 ? c.daysRemaining + ' days left. ' : ''}Try at least one box today.`;
        else msg = `Welcome! Start with your first ₹100 box.`;

        return `
        <div class="glass-card p-6 space-y-4">
          <p class="text-xs uppercase tracking-widest text-zinc-500">AI Savings Coach</p>
          <div class="bg-zinc-900/80 rounded-2xl p-4 text-sm leading-relaxed border border-zinc-800">
            <p class="text-white">${msg}</p>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs text-zinc-400">
            <span>Matrix: ${formatINR(matrix)}</span>
            <span>Boosters: ${formatINR(totalBoosters)}</span>
            <span>Streak: ${streak.currentStreak} days</span>
            <span>Outstanding: ${formatINR(outstanding)}</span>
            <span>Days left: ${c.daysRemaining}</span>
            <span>Required pace: ${reqPace}/day</span>
          </div>
        </div>`;
      }

      function renderSettings() {
        const s = state.settings;
        return `
        <div class="glass-card p-5 space-y-5">
          <p class="text-xs uppercase tracking-widest text-zinc-500">Settings</p>
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <label class="text-sm text-zinc-300">Starting penalty (₹)</label>
              <input id="settingStartPenalty" type="number" value="${s.startPenalty}" class="bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-1.5 w-20 text-sm text-right">
            </div>
            <div class="flex justify-between items-center">
              <label class="text-sm text-zinc-300">Penalty increment (₹)</label>
              <input id="settingPenaltyIncrement" type="number" value="${s.penaltyIncrement}" class="bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-1.5 w-20 text-sm text-right">
            </div>
            <div class="flex justify-between items-center">
              <label class="text-sm text-zinc-300">Daily pace (boxes/day)</label>
              <input id="settingDailyPace" type="number" value="${s.dailyPace || 1}" min="1" max="240" class="bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-1.5 w-20 text-sm text-right">
            </div>
            <div class="flex justify-between items-center">
              <label class="text-sm text-zinc-300">Challenge start date</label>
              <input id="settingStartDate" type="date" value="${s.challengeStart}" class="bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm">
            </div>
            <div class="flex justify-between items-center">
              <label class="text-sm text-zinc-300">Target completion date</label>
              <input id="settingTargetDate" type="date" value="${s.targetDate || DEFAULT_SETTINGS.targetDate}" class="bg-zinc-800 border border-zinc-700 rounded-lg px-2 py-1.5 text-sm">
            </div>
          </div>

          <div class="pt-3 border-t border-zinc-800 space-y-2">
            <div class="flex justify-between items-center">
              <label class="text-sm text-zinc-300">Dashboard password</label>
              <span class="text-xs text-zinc-500">🔒 Protected</span>
            </div>
            <p class="text-[10px] text-zinc-500">For security, the current password is never displayed. To change it, enter the current password and a new one below.</p>
            <input id="settingOldPassword" type="password" placeholder="Current password" autocomplete="off"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm">
            <input id="settingNewPassword" type="password" placeholder="New password (min 4 chars)" autocomplete="new-password"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm">
            <input id="settingConfirmPassword" type="password" placeholder="Confirm new password" autocomplete="new-password"
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm">
            <button id="changePasswordBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded-lg text-sm">
              Change Password
            </button>
          </div>

          <div class="flex gap-3 pt-2 flex-wrap border-t border-zinc-800">
            <button id="saveSettingsBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-xl text-sm">Save Settings</button>
            <button id="resetChallengeBtn" class="bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded-xl text-sm">Reset Challenge</button>
            <button id="importDataBtn" class="bg-zinc-700 hover:bg-zinc-600 text-white font-semibold px-4 py-2 rounded-xl text-sm">Import JSON</button>
          </div>
          <input type="file" id="importFile" accept=".json" class="hidden">
        </div>`;
      }

      let currentTab = 'dashboard';
      function renderCurrentTab() {
        const container = document.getElementById('tabContent');
        let html = '';
        switch (currentTab) {
          case 'dashboard': html = renderDashboard(); break;
          case 'matrix': html = renderMatrix(); break;
          case 'streak': html = renderStreak(); break;
          case 'booster': html = renderBooster(); break;
          case 'penalty': html = renderPenalty(); break;
          case 'activity': html = renderActivity(); break;
          case 'reports': html = renderReports(); break;
          case 'coach': html = renderCoach(); break;
          case 'settings': html = renderSettings(); break;
        }
        container.innerHTML = html;
        document.getElementById('headerMatrix').textContent = formatINR(getMatrixSavings());
        attachTabEvents();
      }

      async function changePasswordFlow() {
        const oldPw = document.getElementById('settingOldPassword').value;
        const newPw = document.getElementById('settingNewPassword').value;
        const confirmPw = document.getElementById('settingConfirmPassword').value;

        if (!(await checkPassword(oldPw))) {
          showToast('Current password is incorrect', 'error');
          return;
        }
        if (newPw.length < 4) {
          showToast('New password must be at least 4 characters', 'error');
          return;
        }
        if (newPw !== confirmPw) {
          showToast('New passwords do not match', 'error');
          return;
        }
        await setPassword(newPw);
        showToast('Password changed successfully', 'success');
        renderCurrentTab();
      }

      function attachTabEvents() {
        const unlockBtn = document.getElementById('unlockFinBtn');
        if (unlockBtn) unlockBtn.addEventListener('click', () => {
          showPasswordModal(() => { finUnlocked = true; showToast('Unlocked', 'success'); renderCurrentTab(); });
        });
        const lockBtn = document.getElementById('lockFinBtn');
        if (lockBtn) lockBtn.addEventListener('click', () => {
          finUnlocked = false; showToast('Locked', 'info'); renderCurrentTab();
        });
        document.querySelectorAll('.period-tab').forEach(tab => {
          tab.addEventListener('click', () => { activePeriod = tab.dataset.period; renderCurrentTab(); });
        });

        const checkNextBtn = document.getElementById('checkNextBtn');
        if (checkNextBtn) checkNextBtn.addEventListener('click', () => {
          const nextBox = getNextBox();
          if (!nextBox) return;
          const pace = getDailyPace();
          const todayBoxes = getTodayBoxesCompleted();
          if (todayBoxes >= pace) {
            showToast(`Daily pace reached (${pace}). Come back tomorrow!`, 'error');
            return;
          }
          nextBox.completed = true;
          nextBox.timestamp = nowISO();
          showToast(`Saved ${formatINR(nextBox.value)}! (${todayBoxes + 1}/${pace})`, 'success');
          saveState();
          renderCurrentTab();
        });

        document.querySelectorAll('.matrix-box.completed').forEach(box => {
          box.addEventListener('click', (e) => {
            e.preventDefault();
            const id = parseInt(box.dataset.boxId, 10);
            const b = state.boxes.find(x => x.id === id);
            if (!b || !b.completed) return;
            showConfirm('Undo Box', `Uncheck this ${formatINR(b.value)} box?`, () => {
              b.completed = false;
              b.timestamp = null;
              saveState();
              renderCurrentTab();
            });
          });
        });

        const paceSelect = document.getElementById('paceSelect');
        if (paceSelect) paceSelect.addEventListener('change', () => {
          const newPace = parseInt(paceSelect.value, 10);
          const todayBoxes = getTodayBoxesCompleted();
          if (todayBoxes > newPace) { showToast(`Already ${todayBoxes} today.`, 'error'); paceSelect.value = getDailyPace(); return; }
          state.settings.dailyPace = newPace; saveState();
          showToast(`Pace: ${newPace}/day`, 'success'); renderCurrentTab();
        });

        const editTargetBtn = document.getElementById('editTargetDateBtn');
        if (editTargetBtn) editTargetBtn.addEventListener('click', () => {
          const current = state.settings.targetDate || DEFAULT_SETTINGS.targetDate;
          const input = window.prompt('Target date (YYYY-MM-DD):', current);
          if (input === null) return;
          const val = input.trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(val) || isNaN(new Date(val+'T00:00:00').getTime())) {
            showToast('Invalid date', 'error'); return;
          }
          state.settings.targetDate = val; saveState();
          showToast('Target updated', 'success'); renderCurrentTab();
        });

        const addBtn = document.getElementById('addBoosterBtn');
        if (addBtn) addBtn.addEventListener('click', () => {
          const amountInput = document.getElementById('boosterAmount');
          const descInput = document.getElementById('boosterDesc');
          const amount = parseFloat(amountInput.value);
          if (!amount || amount <= 0) { showToast('Invalid amount', 'error'); return; }
          const now = new Date();
          state.boosters.push({
            id: uid(), amount: Math.round(amount),
            date: now.toISOString().slice(0,10), time: now.toTimeString().slice(0,5),
            description: descInput.value.trim() || '', timestamp: nowISO()
          });
          saveState(); showToast(`+${formatINR(amount)}`, 'success'); renderCurrentTab();
        });

        document.querySelectorAll('.delete-booster').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.target.dataset.id;
            showConfirm('Delete', 'Remove this entry?', () => {
              state.boosters = state.boosters.filter(b => b.id !== id);
              saveState(); renderCurrentTab();
            });
          });
        });

        document.querySelectorAll('.mark-paid').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const p = state.penalties.find(x => x.id === e.target.dataset.id);
            if (p) { p.paid = true; p.paidDate = todayStr(); saveState(); renderCurrentTab(); }
          });
        });

        const exportJson = document.getElementById('exportJson');
        if (exportJson) exportJson.addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
          a.download = 'savings_backup.json'; a.click(); URL.revokeObjectURL(a.href);
          showToast('Exported', 'success');
        });
        const exportCsv = document.getElementById('exportCsv');
        if (exportCsv) exportCsv.addEventListener('click', () => {
          let csv = 'Date,Type,Amount,Description\n';
          state.boxes.filter(b=>b.completed&&b.timestamp).forEach(b => {
            csv += `${b.timestamp.slice(0,10)},Matrix,${b.value},Box ₹${b.value}\n`;
          });
          state.boosters.forEach(b => { csv += `${b.date},Booster,${b.amount},${b.description||''}\n`; });
          state.penalties.forEach(p => { csv += `${p.date},Penalty,${p.amount},${p.paid?'Paid':'Unpaid'}\n`; });
          const blob = new Blob([csv], { type: 'text/csv' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
          a.download = 'savings_export.csv'; a.click(); URL.revokeObjectURL(a.href);
          showToast('Exported', 'success');
        });

        const saveBtn = document.getElementById('saveSettingsBtn');
        if (saveBtn) saveBtn.addEventListener('click', () => {
          const sp = parseInt(document.getElementById('settingStartPenalty').value, 10);
          const pi = parseInt(document.getElementById('settingPenaltyIncrement').value, 10);
          const dp = parseInt(document.getElementById('settingDailyPace').value, 10);
          const sd = document.getElementById('settingStartDate').value;
          const td = document.getElementById('settingTargetDate').value;
          if (sp > 0) state.settings.startPenalty = sp;
          if (pi > 0) state.settings.penaltyIncrement = pi;
          if (dp > 0) {
            const todayBoxes = getTodayBoxesCompleted();
            if (todayBoxes > dp) { showToast(`Can't be below ${todayBoxes}.`, 'error'); return; }
            state.settings.dailyPace = dp;
          }
          if (sd) state.settings.challengeStart = sd;
          if (td) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(td)) { showToast('Invalid date', 'error'); return; }
            state.settings.targetDate = td;
          }
          saveState(); showToast('Settings saved', 'success'); renderCurrentTab();
        });

        const changePwBtn = document.getElementById('changePasswordBtn');
        if (changePwBtn) changePwBtn.addEventListener('click', changePasswordFlow);

        const resetBtn = document.getElementById('resetChallengeBtn');
        if (resetBtn) resetBtn.addEventListener('click', () => {
          showConfirm('Reset Challenge', 'This erases ALL data. Sure?', () => {
            localStorage.removeItem(STORAGE_KEY); location.reload();
          });
        });

        const importBtn = document.getElementById('importDataBtn');
        if (importBtn) importBtn.addEventListener('click', () => document.getElementById('importFile').click());
        const importFile = document.getElementById('importFile');
        if (importFile) importFile.addEventListener('change', (e) => {
          const file = e.target.files[0]; if (!file) return;
          const reader = new FileReader();
          reader.onload = async (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (parsed.version === 1 && Array.isArray(parsed.boxes) && parsed.boxes.length === TOTAL_BOXES) {
                state = parsed;
                state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
                if (!state.settings.dailyPace) state.settings.dailyPace = 1;
                if (!state.settings.targetDate) state.settings.targetDate = DEFAULT_SETTINGS.targetDate;
                if (!Array.isArray(state.boosters)) state.boosters = [];
                if (!Array.isArray(state.penalties)) state.penalties = [];
                if (!Array.isArray(state.missedDates)) state.missedDates = [];
                if (!state.settings.dashboardPasswordHash) {
                  const legacyPlain = state.settings.dashboardPassword;
                  state.settings.dashboardPasswordHash = await hashPassword(legacyPlain || DEFAULT_PASSWORD);
                }
                delete state.settings.dashboardPassword;
                saveState(); showToast('Imported', 'success'); renderCurrentTab();
              } else showToast('Invalid file', 'error');
            } catch (err) { showToast('Invalid JSON', 'error'); }
          };
          reader.readAsText(file);
        });
      }

      function setupNav() {
        document.querySelectorAll('#mainNav button').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#mainNav button').forEach(b => {
              b.classList.remove('tab-active', 'text-emerald-400');
              b.classList.add('text-zinc-400');
            });
            btn.classList.add('tab-active', 'text-emerald-400');
            btn.classList.remove('text-zinc-400');
            currentTab = btn.dataset.tab;
            renderCurrentTab();
          });
        });
      }

      async function boot() {
        await loadState();
        reconcileMissedDays();
        saveState();
        setupNav();
        renderCurrentTab();
        setTimeout(checkPenaltyPopup, 800);
      }

      boot();
    })();
  </script>
</body>
</html>
