<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>₹ Lakh Challenge</title>
<style>
  /* ============ THEME VARIABLES ============ */
  :root {
    --bg: #000;
    --surface: #0a0a0a;
    --surface-2: #000;
    --border: #1a1a1a;
    --border-2: #222;
    --border-3: #333;
    --text: #fff;
    --text-dim: #888;
    --text-muted: #666;
    --text-faint: #444;
    --text-ghost: #555;
    --bar-bg: #1a1a1a;
    --bar-fill: #fff;
    --btn-primary-bg: #fff;
    --btn-primary-text: #000;
    --btn-primary-hover: #e5e5e5;
    --btn-invert-bg: #000;
    --btn-invert-text: #fff;
    --btn-invert-hover: #1a1a1a;
    --hero-bg: #fff;
    --hero-text: #000;
    --hero-text-dim: #555;
    --hero-surface: #f5f5f5;
    --hero-border: #e5e5e5;
    --hero-bar-bg: rgba(0,0,0,0.1);
    --hero-bar-fill: #000;
    --hero-div: #e5e5e5;
    --badge-invert-bg: #000;
    --badge-invert-text: #fff;
    --cal-bg: #0f0f0f;
    --cal-faint: #444;
    --cal-missed-bg: #1a1a1a;
    --cal-missed-text: #666;
    --m-box-bg: #111;
    --m-box-border: #1f1f1f;
    --m-box-text: #555;
    --toast-bg: #fff;
    --toast-text: #000;
    --modal-bg: rgba(0,0,0,0.85);
    --dot-off: #666;
    --dot-on: #fff;
    --status-warn-border: #444;
  }

  html[data-theme="soft"] {
    --bg: #1a1a1f;
    --surface: #232329;
    --surface-2: #1f1f24;
    --border: #2f2f37;
    --border-2: #383841;
    --border-3: #464652;
    --text: #f0f0f2;
    --text-dim: #a0a0a8;
    --text-muted: #7a7a82;
    --text-faint: #5a5a62;
    --text-ghost: #6a6a72;
    --bar-bg: #2f2f37;
    --bar-fill: #f0f0f2;
    --btn-primary-bg: #f0f0f2;
    --btn-primary-text: #1a1a1f;
    --btn-primary-hover: #d8d8de;
    --btn-invert-bg: #1a1a1f;
    --btn-invert-text: #f0f0f2;
    --btn-invert-hover: #232329;
    --hero-bg: #f0f0f2;
    --hero-text: #1a1a1f;
    --hero-text-dim: #6a6a72;
    --hero-surface: #e2e2e6;
    --hero-border: #d0d0d6;
    --hero-bar-bg: rgba(0,0,0,0.08);
    --hero-bar-fill: #1a1a1f;
    --hero-div: #d0d0d6;
    --badge-invert-bg: #1a1a1f;
    --badge-invert-text: #f0f0f2;
    --cal-bg: #2a2a31;
    --cal-faint: #5a5a62;
    --cal-missed-bg: #2f2f37;
    --cal-missed-text: #7a7a82;
    --m-box-bg: #2a2a31;
    --m-box-border: #383841;
    --m-box-text: #7a7a82;
    --toast-bg: #f0f0f2;
    --toast-text: #1a1a1f;
    --modal-bg: rgba(10,10,12,0.85);
    --dot-off: #7a7a82;
    --dot-on: #f0f0f2;
    --status-warn-border: #5a5a62;
  }

  html[data-theme="contrast"] {
    --bg: #000;
    --surface: #000;
    --surface-2: #000;
    --border: #fff;
    --border-2: #fff;
    --border-3: #fff;
    --text: #fff;
    --text-dim: #fff;
    --text-muted: #fff;
    --text-faint: #fff;
    --text-ghost: #fff;
    --bar-bg: #fff;
    --bar-fill: #fff;
    --btn-primary-bg: #fff;
    --btn-primary-text: #000;
    --btn-primary-hover: #fff;
    --btn-invert-bg: #000;
    --btn-invert-text: #fff;
    --btn-invert-hover: #000;
    --hero-bg: #fff;
    --hero-text: #000;
    --hero-text-dim: #000;
    --hero-surface: #fff;
    --hero-border: #000;
    --hero-bar-bg: #000;
    --hero-bar-fill: #000;
    --hero-div: #000;
    --badge-invert-bg: #000;
    --badge-invert-text: #fff;
    --cal-bg: #000;
    --cal-faint: #fff;
    --cal-missed-bg: #000;
    --cal-missed-text: #fff;
    --m-box-bg: #000;
    --m-box-border: #fff;
    --m-box-text: #fff;
    --toast-bg: #fff;
    --toast-text: #000;
    --modal-bg: rgba(0,0,0,0.95);
    --dot-off: #fff;
    --dot-on: #fff;
    --status-warn-border: #fff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); transition: background 0.25s, color 0.25s; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    line-height: 1.5;
  }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }

  .hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; gap: 16px; }
  .hdr h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .hdr p { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-top: 6px; font-weight: 500; }
  .bal { text-align: right; }
  .bal small { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
  .bal b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }

  .nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; -webkit-overflow-scrolling: touch; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button {
    flex-shrink: 0; background: transparent; border: 1px solid var(--border-2);
    color: var(--text-dim); font-size: 12px; font-weight: 600; padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: all 0.15s;
  }
  .nav button:hover { color: var(--text); border-color: var(--border-3); }
  .nav button.active { background: var(--btn-primary-bg); color: var(--btn-primary-text); border-color: var(--btn-primary-bg); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .card-tight { padding: 14px; }
  .card-hero { background: var(--hero-bg); color: var(--hero-text); border: none; }
  .stack > * + * { margin-top: 16px; }
  .stack-sm > * + * { margin-top: 10px; }
  .stack-lg > * + * { margin-top: 24px; }

  .label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .label-lg { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .card-hero .label-lg { color: var(--hero-text-dim); }
  .big { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .big-lg { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .big-xl { font-size: 48px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .h2 { font-size: 16px; font-weight: 700; }
  .muted { color: var(--text-muted); }
  .dim { color: var(--text-dim); }

  .div { height: 1px; background: var(--border); margin: 14px 0; }
  .card-hero .div { background: var(--hero-div); }

  .bar { height: 6px; background: var(--bar-bg); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--bar-fill); border-radius: 3px; transition: width 0.4s ease; }
  .card-hero .bar { background: var(--hero-bar-bg); }
  .card-hero .bar > div { background: var(--hero-bar-fill); }

  .row { display: flex; gap: 10px; }
  .row-b { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 480px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }

  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .stat .label { display: block; margin-bottom: 6px; }
  .stat b { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .card-hero .stat { background: var(--hero-surface); border-color: var(--hero-border); }
  .card-hero .stat .label { color: var(--hero-text-dim); }
  .card-hero .stat b { color: var(--hero-text); }

  .m-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px; }
  .m-box {
    aspect-ratio: 1; border-radius: 3px; background: var(--m-box-bg); border: 1px solid var(--m-box-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600; color: var(--m-box-text); cursor: pointer;
    user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: "SF Mono", Menlo, Consolas, monospace; line-height: 1; overflow: hidden;
    transition: all 0.15s;
  }
  @media (min-width: 480px) { .m-box { font-size: 10px; border-radius: 4px; } }
  .m-box:active { transform: scale(0.92); }
  .m-box.done { background: var(--btn-primary-bg); border-color: var(--btn-primary-bg); color: var(--btn-primary-text); font-weight: 700; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 10px; font-family: inherit;
    font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--btn-primary-bg); color: var(--btn-primary-text); padding: 14px 20px; font-size: 14px; width: 100%; }
  .btn-primary:hover { background: var(--btn-primary-hover); }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border-3); padding: 10px 16px; font-size: 13px; }
  .btn-secondary:hover { border-color: var(--text-dim); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); padding: 8px 14px; font-size: 12px; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-3); }
  .btn-danger { background: transparent; color: var(--text); border: 1px solid var(--border-3); padding: 10px 16px; font-size: 13px; }
  .btn-danger:hover { background: var(--border); }
  .btn-sm { padding: 6px 12px; font-size: 11px; }

  .inp {
    background: var(--surface-2); border: 1px solid var(--border-2); color: var(--text); padding: 10px 12px;
    border-radius: 10px; font-family: inherit; font-size: 14px; width: 100%;
    outline: none; transition: border 0.15s;
  }
  .inp:focus { border-color: var(--text-dim); }
  .inp::placeholder { color: var(--text-faint); }
  select.inp { cursor: pointer; }
  input[type="number"].inp { font-family: "SF Mono", Menlo, Consolas, monospace; }

  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { background: transparent; border: 1px solid var(--border-2); color: var(--text-dim); padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .pill:hover { color: var(--text); border-color: var(--border-3); }
  .pill.active { background: var(--btn-primary-bg); color: var(--btn-primary-text); border-color: var(--btn-primary-bg); }

  .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px; }
  .list-row:last-child { border-bottom: none; }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; border-radius: 6px; background: var(--cal-bg); color: var(--cal-faint); font-family: "SF Mono", Menlo, Consolas, monospace; }
  .cal-day.done { background: var(--btn-primary-bg); color: var(--btn-primary-text); }
  .cal-day.missed { background: var(--cal-missed-bg); color: var(--cal-missed-text); }
  .cal-day.today { outline: 1px solid var(--text); outline-offset: -1px; }

  .modal-bg { position: fixed; inset: 0; background: var(--modal-bg); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border-2); border-radius: 16px; width: 100%; max-width: 400px; padding: 24px; }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
  .modal p { color: var(--text-dim); font-size: 14px; line-height: 1.5; }

  #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; width: 100%; max-width: 360px; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { background: var(--toast-bg); color: var(--toast-text); padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

  .empty { text-align: center; padding: 32px 16px; color: var(--text-ghost); font-size: 13px; }
  .badge { display: inline-flex; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid var(--border-2); color: var(--text-dim); }
  .badge-fill { background: var(--btn-primary-bg); color: var(--btn-primary-text); border-color: var(--btn-primary-bg); }
  .badge-invert { background: var(--badge-invert-bg); color: var(--badge-invert-text); border-color: var(--badge-invert-bg); }

  .status-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
  .status-bar.warn { border-color: var(--status-warn-border); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot-off); flex-shrink: 0; }
  .status-dot.on { background: var(--dot-on); }

  .theme-switcher {
    display: flex;
    gap: 6px;
    padding: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border-2);
    border-radius: 10px;
  }
  .theme-switcher button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .theme-switcher button:hover { color: var(--text); }
  .theme-switcher button.active {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-text);
  }
  .theme-icon { font-size: 13px; margin-right: 4px; }

  .level-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border-2);
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-dim);
  }
  .level-chip b { color: var(--text); font-size: 12px; }
  .level-chip.on { background: var(--btn-primary-bg); color: var(--btn-primary-text); border-color: var(--btn-primary-bg); }
  .level-chip.on b { color: var(--btn-primary-text); }

  .error-screen {
    position: fixed; inset: 0; background: #000; color: #fff; padding: 24px;
    font-family: monospace; font-size: 13px; z-index: 9999; overflow: auto;
    line-height: 1.6; white-space: pre-wrap;
  }
  .error-screen h2 { color: #fff; font-size: 16px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #333; }
</style>
</head>
<body>

<div class="error-screen" id="fatalError" style="display:none;">
  <h2>⚠️ Startup Error</h2>
  <div id="fatalErrorMsg"></div>
</div>

<div class="wrap" id="mainApp">
  <header class="hdr">
    <div>
      <h1 id="hdrTitle">₹1 LAKH<br>CHALLENGE</h1>
      <p id="hdrSub">240 Boxes · Level 1</p>
    </div>
    <div class="bal">
      <small>Total Saved</small>
      <b id="headerMatrix" class="mono">₹0</b>
    </div>
  </header>

  <nav class="nav" id="mainNav">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="matrix">Matrix</button>
    <button data-tab="levels">Levels</button>
    <button data-tab="streak">Streak</button>
    <button data-tab="booster">Booster</button>
    <button data-tab="penalty">Penalty</button>
    <button data-tab="activity">Activity</button>
    <button data-tab="reports">Reports</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <main id="tabContent"><div class="empty">Loading…</div></main>
</div>

<div id="penaltyModal" class="modal-bg">
  <div class="modal">
    <h3>Missed Streak</h3>
    <p id="penaltyModalText" style="margin-bottom:20px;"></p>
    <div class="row">
      <button id="penaltyPayBtn" class="btn btn-primary" style="flex:1;">Mark Paid</button>
      <button id="penaltyLaterBtn" class="btn btn-secondary" style="flex:1;">Later</button>
    </div>
  </div>
</div>

<div id="passwordModal" class="modal-bg">
  <div class="modal">
    <h3>Unlock Details</h3>
    <p style="margin-bottom:16px;">Enter password to view financial details.</p>
    <input id="passwordInput" type="password" class="inp" placeholder="Password" autocomplete="off" style="margin-bottom:8px;">
    <p id="passwordError" style="display:none; color:var(--text); font-size:12px; margin-bottom:12px;">Incorrect password</p>
    <div class="row">
      <button id="passwordSubmit" class="btn btn-primary" style="flex:1;">Unlock</button>
      <button id="passwordCancel" class="btn btn-secondary" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-bg">
  <div class="modal">
    <h3 id="confirmTitle">Confirm</h3>
    <p id="confirmMessage"></p>
    <div class="row" style="margin-top:20px;">
      <button id="confirmYes" class="btn btn-primary" style="flex:1;">Yes</button>
      <button id="confirmNo" class="btn btn-secondary" style="flex:1;">Cancel</button>
    </div>
  </div>
</div>

<div id="levelUpModal" class="modal-bg">
  <div class="modal" style="text-align:center;">
    <div style="font-size:48px; margin-bottom:8px;">🏆</div>
    <h3 id="levelUpTitle" style="font-size:22px; margin-bottom:12px;">Level Complete!</h3>
    <p id="levelUpMsg" style="margin-bottom:24px;"></p>
    <button id="levelUpContinue" class="btn btn-primary">Start Next Level</button>
  </div>
</div>

<div id="toasts"></div>

<script>
(function() {
  'use strict';

  window.onerror = function(msg, src, line, col, err) {
    showFatal('Runtime error: ' + msg + '\n\nLine ' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : ''));
    return false;
  };
  function showFatal(msg) {
    try {
      document.getElementById('fatalErrorMsg').textContent = msg;
      document.getElementById('fatalError').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
    } catch (e) {
      document.body.innerHTML = '<pre style="color:#fff; background:#000; padding:20px;">' + msg + '</pre>';
    }
  }

  const DENOMS = [
    { value: 100, count: 20 },
    { value: 200, count: 40 },
    { value: 500, count: 180 }
  ];
  const TOTAL_BOXES = 240;
  const LEVEL_TARGET = 100000; // each level is ₹1 lakh
  const STORAGE_KEY = 'savings_mono_v3';
  const THEME_KEY = 'savings_theme_v1';
  const DEFAULT_PASSWORD = '1234';

  function hashStr(s) {
    let h1 = 0x811c9dc5 >>> 0;
    let h2 = 0xdeadbeef >>> 0;
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i);
      h1 ^= c; h1 = Math.imul(h1, 0x01000193) >>> 0;
      h2 ^= c; h2 = Math.imul(h2, 0x85ebca6b) >>> 0;
      h2 = ((h2 << 13) | (h2 >>> 19)) >>> 0;
    }
    return h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
  }

  let storageOK = true;
  function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { storageOK = false; return null; } }
  function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { storageOK = false; } }
  function storageRemove(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---- Theme ----
  let currentTheme = 'dark';
  function setTheme(name) {
    if (name !== 'dark' && name !== 'soft' && name !== 'contrast') name = 'dark';
    currentTheme = name;
    document.documentElement.setAttribute('data-theme', name === 'dark' ? '' : name);
    if (name === 'dark') document.documentElement.removeAttribute('data-theme');
    storageSet(THEME_KEY, name);
    const sw = document.getElementById('themeSwitcher');
    if (sw) {
      const btns = sw.querySelectorAll('button');
      for (let i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].getAttribute('data-theme-name') === name);
      }

  }
  function loadTheme() {

  // ---- Date helpers ----
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function nowISO() { return new Date().toISOString(); }
  function displayDate(iso) {
    if (!iso || typeof iso !== 'string') return '—';
    const parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }
  function parseDisplayDate(s) {
    if (!s || typeof s !== 'string') return null;
    const m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    const dd = parseInt(m[1], 10);
    const mm = parseInt(m[2], 10);
    const yyyy = parseInt(m[3], 10);
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31 || yyyy < 1900 || yyyy > 2200) return null;
    const test = new Date(yyyy, mm - 1, dd);
    if (test.getFullYear() !== yyyy || test.getMonth() !== mm - 1 || test.getDate() !== dd) return null;
    return yyyy + '-' + String(mm).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
  }
  function fmt(n) { return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function addDays(ds, n) {
    const parts = ds.split('-');
    const d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function daysBetween(a, b) {
    const p1 = a.split('-'), p2 = b.split('-');
    const d1 = new Date(+p1[0], +p1[1]-1, +p1[2]);
    const d2 = new Date(+p2[0], +p2[1]-1, +p2[2]);
    return Math.round((d2 - d1) / 86400000);
  }
  function validDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }

  function lakhLabel(level) {
    return '₹' + level + ' Lakh';
  }

  const DEFAULT_SETTINGS = {
    startPenalty: 50,
    penaltyIncrement: 50,
    dailyPace: 1,
    challengeStart: todayStr(),
    targetDate: addDays(todayStr(), 240),
    passwordHash: hashStr(DEFAULT_PASSWORD)
  };

  let state = {
    version: 3,
    currentLevel: 1,
    boxes: [],
    levels: [],
    boosters: [], penalties: [], missedDates: [],
    settings: Object.assign({}, DEFAULT_SETTINGS),
    lastPenaltyPopupDate: null
  };

  function initBoxes() {
    const arr = [];
    let id = 0;
    for (let d = 0; d < DENOMS.length; d++) {
      for (let i = 0; i < DENOMS[d].count; i++) {
        arr.push({ id: id++, value: DENOMS[d].value, completed: false, timestamp: null });
      }
    }
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function loadState() {
    try {
      const raw = storageGet(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.version === 3 && Array.isArray(p.boxes) && p.boxes.length === TOTAL_BOXES) {
          state = p;
          state.settings = Object.assign({}, DEFAULT_SETTINGS, state.settings || {});
          if (!state.settings.passwordHash) state.settings.passwordHash = hashStr(DEFAULT_PASSWORD);
          if (!Array.isArray(state.boosters)) state.boosters = [];
          if (!Array.isArray(state.penalties)) state.penalties = [];
          if (!Array.isArray(state.missedDates)) state.missedDates = [];
          if (!Array.isArray(state.levels)) state.levels = [];
          if (typeof state.currentLevel !== 'number' || state.currentLevel < 1) state.currentLevel = 1;
          return;
        }
      }
    } catch (e) { console.warn('Load failed:', e); }
    state = {
      version: 3,
      currentLevel: 1,
      boxes: initBoxes(),
      levels: [],
      boosters: [], penalties: [], missedDates: [],
      settings: Object.assign({}, DEFAULT_SETTINGS),
      lastPenaltyPopupDate: null
    };
    saveState();
  }

  function saveState() {
    try { storageSet(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn('Save failed:', e); }
  }

  function reconcileMissedDays() {
    const start = state.settings.challengeStart;
    const today = todayStr();
    if (!validDate(start) || start >= today) return;
    const missed = [];
    let d = start;
    let guard = 0;
    while (d < today && guard++ < 5000) {
      let found = false;
      for (let i = 0; i < state.boxes.length; i++) {
        const b = state.boxes[i];
        if (b.completed && b.timestamp && b.timestamp.slice(0,10) === d) { found = true; break; }
      }
      if (!found) {
        for (let L = 0; L < state.levels.length; L++) {
          const boxes = state.levels[L].boxes || [];
          for (let i = 0; i < boxes.length; i++) {
            const b = boxes[i];
            if (b.completed && b.timestamp && b.timestamp.slice(0,10) === d) { found = true; break; }
          }
          if (found) break;
        }
      }
      if (!found) missed.push(d);
      const next = addDays(d, 1);
      if (next === d) break;
      d = next;
    }
    const existing = {};
    for (let i = 0; i < state.penalties.length; i++) existing[state.penalties[i].date] = true;
    for (let i = 0; i < missed.length; i++) {
      const md = missed[i];
      if (!existing[md]) {
        let cons = 0, chk = md, g = 0;
        while (missed.indexOf(chk) !== -1 && g++ < 5000) {
          cons++;
          chk = addDays(chk, -1);
          if (!validDate(chk)) break;
        }
        const amount = state.settings.startPenalty + (cons - 1) * state.settings.penaltyIncrement;
        state.penalties.push({
          id: uid(), date: md, amount: amount, paid: false, paidDate: null, timestamp: nowISO()
        });
      }
    }
    state.missedDates = missed;
    saveState();
  }

  // ---- Level helpers ----
  function levelBoxesSaved() {
    let s = 0;
    for (let i = 0; i < state.boxes.length; i++) if (state.boxes[i].completed) s += state.boxes[i].value;
    return s;
  }
  function levelBoxesDone() {
    let c = 0;
    for (let i = 0; i < state.boxes.length; i++) if (state.boxes[i].completed) c++;
    return c;
  }
  function archivedSaved() {
    let s = 0;
    for (let L = 0; L < state.levels.length; L++) {
      const boxes = state.levels[L].boxes || [];
      for (let i = 0; i < boxes.length; i++) if (boxes[i].completed) s += boxes[i].value;
    }
    return s;
  }
  function totalSaved() { return archivedSaved() + levelBoxesSaved(); }
  function totalDone() {
    let c = levelBoxesDone();
    for (let L = 0; L < state.levels.length; L++) {
      const boxes = state.levels[L].boxes || [];
      for (let i = 0; i < boxes.length; i++) if (boxes[i].completed) c++;
    }
    return c;
  }
  function totalTarget() { return state.currentLevel * LEVEL_TARGET; }

  function checkLevelUp() {
    if (levelBoxesDone() < TOTAL_BOXES) return false;
    const lv = state.currentLevel;
    state.levels.push({
      level: lv,
      boxes: state.boxes.map(function(b) { return Object.assign({}, b); }),
      completedAt: nowISO()
    });
    state.currentLevel = lv + 1;
    state.boxes = initBoxes();
    saveState();
    return true;
  }

  function matrixSaved() { return totalSaved(); }
  function matrixDone() { return totalDone(); }

  function boostersTotal() {
    let s = 0;
    for (let i = 0; i < state.boosters.length; i++) s += state.boosters[i].amount;
    return s;
  }
  function penaltiesGen() {
    let s = 0;
    for (let i = 0; i < state.penalties.length; i++) s += state.penalties[i].amount;
    return s;
  }
  function penaltiesPaid() {
    let s = 0;
    for (let i = 0; i < state.penalties.length; i++) if (state.penalties[i].paid) s += state.penalties[i].amount;
    return s;
  }
  function outstanding() { return penaltiesGen() - penaltiesPaid(); }

  function todayDone() {
    const t = todayStr();
    let c = 0;
    for (let i = 0; i < state.boxes.length; i++) {
      const b = state.boxes[i];
      if (b.completed && b.timestamp && b.timestamp.slice(0,10) === t) c++;
    }
    return c;
  }
  function todaySaved() {
    const t = todayStr();
    let s = 0;
    for (let i = 0; i < state.boxes.length; i++) {
      const b = state.boxes[i];
      if (b.completed && b.timestamp && b.timestamp.slice(0,10) === t) s += b.value;
    }
    return s;
  }
  function getPace() { return state.settings.dailyPace || 1; }
  function nextBox() {
    for (let i = 0; i < state.boxes.length; i++) if (!state.boxes[i].completed) return state.boxes[i];
    return null;
  }
  function completedListCurrentLevel() {
    const out = [];
    for (let i = 0; i < state.boxes.length; i++) {
      const b = state.boxes[i];
      if (b.completed && b.timestamp) out.push(b);
    }
    out.sort(function(a, b) { return a.timestamp < b.timestamp ? -1 : 1; });
    return out;
  }
  function getStreak() {
    const dates = {};
    for (let i = 0; i < state.boxes.length; i++) {
      const b = state.boxes[i];
      if (b.completed && b.timestamp) dates[b.timestamp.slice(0,10)] = true;
    }
    for (let L = 0; L < state.levels.length; L++) {
      const boxes = state.levels[L].boxes || [];
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (b.completed && b.timestamp) dates[b.timestamp.slice(0,10)] = true;
      }
    }
    const sorted = Object.keys(dates).sort();
    let cur = 0, best = 0, run = 0, prev = null;
    let chk = dates[todayStr()] ? todayStr() : addDays(todayStr(), -1);
    let g = 0;
    while (dates[chk] && g++ < 5000) { cur++; chk = addDays(chk, -1); if (!validDate(chk)) break; }
    for (let i = 0; i < sorted.length; i++) {
      const d = sorted[i];
      if (prev) run = (daysBetween(prev, d) === 1) ? run + 1 : 1;
      else run = 1;
      if (run > best) best = run;
      prev = d;
    }
    return { current: cur, best: best, total: sorted.length, dates: sorted };
  }
  function getCountdown() {
    const today = todayStr();
    const target = validDate(state.settings.targetDate) ? state.settings.targetDate : DEFAULT_SETTINGS.targetDate;
    const daysLeft = daysBetween(today, target);
    const remBoxes = TOTAL_BOXES - levelBoxesDone();
    const remAmount = LEVEL_TARGET - levelBoxesSaved();
    let reqPace = 0;
    if (daysLeft > 0 && remBoxes > 0) reqPace = remBoxes / daysLeft;
    else if (remBoxes > 0) reqPace = Infinity;
    const start = validDate(state.settings.challengeStart) ? state.settings.challengeStart : today;
    const totalDays = Math.max(1, daysBetween(start, target));
    const elapsed = Math.max(0, Math.min(totalDays, daysBetween(start, today)));
    const expected = Math.floor((elapsed / totalDays) * TOTAL_BOXES);
    const delta = levelBoxesDone() - expected;
    let status = 'on-track';
    if (daysLeft < 0 && remBoxes > 0) status = 'overdue';
    else if (delta >= 5) status = 'ahead';
    else if (delta <= -5) status = 'behind';
    const reqSavings = (daysLeft > 0 && remAmount > 0) ? Math.ceil(remAmount / daysLeft) : 0;
    return { daysLeft: daysLeft, target: target, remBoxes: remBoxes, remAmount: remAmount, reqPace: reqPace, reqSavings: reqSavings, delta: delta, status: status };
  }

  // ============ SMART DAILY TARGET ============
  function getSmartTarget() {
    const today = todayStr();
    const target = validDate(state.settings.targetDate) ? state.settings.targetDate : DEFAULT_SETTINGS.targetDate;
    const daysLeft = Math.max(0, daysBetween(today, target));
    const saved = levelBoxesSaved();
    const done = levelBoxesDone();
    const remaining = LEVEL_TARGET - saved;
    const remBoxes = TOTAL_BOXES - done;
    const streak = getStreak();
    const missed = state.missedDates.length;
    const tDone = todayDone();
    const tSaved = todaySaved();
    const pace = getPace();

    let baseDaily = 0;
    if (daysLeft > 0 && remaining > 0) baseDaily = remaining / daysLeft;
    else if (daysLeft === 0 && remaining > 0) baseDaily = remaining;

    let streakDiscount = 0;
    if (streak.current >= 14) streakDiscount = 0.15;
    else if (streak.current >= 7) streakDiscount = 0.10;
    else if (streak.current >= 3) streakDiscount = 0.05;

    let missPenaltyFactor = 1;
    if (missed > 0 && daysLeft > 0) {
      const missPressure = Math.min(0.25, (missed / Math.max(1, daysLeft)) * 0.5);
      missPenaltyFactor = 1 + missPressure;
    }

    let adjusted = baseDaily * (1 - streakDiscount) * missPenaltyFactor;
    let rounded = Math.ceil(adjusted / 50) * 50;
    let todayTarget = Math.max(0, rounded - tSaved);

    const nb = nextBox();
    if (nb && tDone < pace) {
      let minVal = 500;
      for (let i = 0; i < state.boxes.length; i++) {
        if (!state.boxes[i].completed && state.boxes[i].value < minVal) minVal = state.boxes[i].value;
      }
      const paceFloor = minVal * Math.max(0, pace - tDone);
      todayTarget = Math.max(todayTarget, paceFloor);
    }

    if (remaining > 0) todayTarget = Math.min(todayTarget, remaining);
    else todayTarget = 0;

    let statusText, statusKind;
    if (remaining <= 0) { statusText = 'Level complete — advancing'; statusKind = 'done'; }
    else if (daysLeft <= 0) { statusText = 'Target date reached — finish now'; statusKind = 'urgent'; }
    else if (tSaved >= todayTarget && todayTarget > 0) { statusText = 'Daily target hit'; statusKind = 'done'; }
    else if (tSaved > 0) { statusText = fmt(todayTarget) + ' more to go'; statusKind = 'progress'; }
    else if (streak.current >= 7) { statusText = 'On ' + streak.current + '-day streak — keep it alive'; statusKind = 'streak'; }
    else { statusText = 'Save ' + fmt(todayTarget) + ' today to stay on track'; statusKind = 'normal'; }

    let boxesToday = 0;
    let boxesAmount = 0;
    const avail = state.boxes.filter(function(b) { return !b.completed; }).sort(function(a, b) { return a.value - b.value; });
    for (let i = 0; i < avail.length; i++) {
      boxesAmount += avail[i].value;
      boxesToday++;
      if (boxesAmount >= todayTarget) break;
    }
    if (boxesAmount < todayTarget && avail.length > 0) boxesToday = avail.length;

    return {
      todayTarget: todayTarget, baseDaily: Math.round(baseDaily),
      streakDiscount: streakDiscount, missPenaltyFactor: missPenaltyFactor,
      daysLeft: daysLeft, streak: streak.current, missed: missed,
      remaining: remaining, remBoxes: remBoxes, saved: saved,
      todaySaved: tSaved, tDone: tDone, boxesToday: boxesToday,
      boxesAmount: boxesAmount, statusText: statusText,
      statusKind: statusKind, pace: pace
    };
  }

  function getTimeline() {
    const start = validDate(state.settings.challengeStart) ? state.settings.challengeStart : todayStr();
    const target = validDate(state.settings.targetDate) ? state.settings.targetDate : DEFAULT_SETTINGS.targetDate;
    const today = todayStr();
    const saved = levelBoxesSaved();
    const done = levelBoxesDone();
    const pace = getPace();

    const totalDays = Math.max(1, daysBetween(start, target));
    const elapsed = Math.max(0, Math.min(totalDays, daysBetween(start, today)));
    const daysLeft = daysBetween(today, target);

    let projectedFinish = null;
    const remBoxes = TOTAL_BOXES - done;
    if (remBoxes > 0 && pace > 0) projectedFinish = addDays(today, Math.ceil(remBoxes / pace));
    else if (remBoxes === 0) projectedFinish = today;

    let avgDaily = 0;
    const st = getStreak();
    if (st.total > 0 && saved > 0) avgDaily = saved / st.total;
    if (avgDaily <= 0 && totalDays > 0) avgDaily = LEVEL_TARGET / totalDays;

    return {
      start: start,
      today: today,
      target: target,
      projectedFinish: projectedFinish,
      totalDays: totalDays,
      elapsed: elapsed,
      daysLeft: daysLeft,
      avgDaily: Math.round(avgDaily)
    };
  }

  function periodRange(p) {
    const t = todayStr();
    if (p === 'today') return { from: t, to: t };
    if (p === 'week') {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const s = new Date(now);
      s.setDate(now.getDate() + diff);
      return { from: s.getFullYear() + '-' + String(s.getMonth()+1).padStart(2,'0') + '-' + String(s.getDate()).padStart(2,'0'), to: t };
    }
    if (p === 'month') {
      const now = new Date();
      return { from: now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-01', to: t };
    }
    return { from: state.settings.challengeStart || t, to: t };
  }
  function breakdown(from, to) {
    let matrix = 0, mB = 0, boost = 0, bC = 0, pPaid = 0, pPaidC = 0, pGen = 0, pGenC = 0;
    function scanBoxes(boxes) {
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (b.completed && b.timestamp) {
          const d = b.timestamp.slice(0,10);
          if (d >= from && d <= to) { matrix += b.value; mB++; }
        }
      }
    }
    scanBoxes(state.boxes);
    for (let L = 0; L < state.levels.length; L++) scanBoxes(state.levels[L].boxes || []);
    for (let i = 0; i < state.boosters.length; i++) {
      const b = state.boosters[i];
      if (b.date >= from && b.date <= to) { boost += b.amount; bC++; }
    }
    for (let i = 0; i < state.penalties.length; i++) {
      const p = state.penalties[i];
      if (p.date >= from && p.date <= to) { pGen += p.amount; pGenC++; }
      if (p.paid && p.paidDate && p.paidDate >= from && p.paidDate <= to) { pPaid += p.amount; pPaidC++; }
    }
    return { matrix: matrix, mB: mB, boost: boost, bC: bC, pPaid: pPaid, pPaidC: pPaidC, pGen: pGen, pGenC: pGenC, total: matrix + boost + pPaid };
  }

  function renderActivity() {
    const map = {};
    function ensure(d) { if (!map[d]) map[d] = { matrix: 0, boxes: 0, boost: 0, pGen: 0, pPaid: 0 }; return map[d]; }
    function scanBoxes(boxes) {
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (b.completed && b.timestamp) { const r = ensure(b.timestamp.slice(0,10)); r.matrix += b.value; r.boxes++; }
      }
    }
    scanBoxes(state.boxes);
    for (let L = 0; L < state.levels.length; L++) scanBoxes(state.levels[L].boxes || []);
    for (let i = 0; i < state.boosters.length; i++) ensure(state.boosters[i].date).boost += state.boosters[i].amount;
    for (let i = 0; i < state.penalties.length; i++) {
      const p = state.penalties[i];
      ensure(p.date).pGen += p.amount;
      if (p.paid && p.paidDate) ensure(p.paidDate).pPaid += p.amount;
    }
    const dates = Object.keys(map).filter(validDate).sort().reverse();
    let html = '<div class="stack"><div class="label-lg">Activity Log</div>';
    if (dates.length) {
      for (let i = 0; i < dates.length; i++) {
        const d = dates[i];
        const r = map[d];
        const actual = r.matrix + r.boost;
        const parts = d.split('-');
        const dateObj = new Date(+parts[0], +parts[1]-1, +parts[2]);
        const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dateObj.getDay()];
        html += '<div class="card card-tight">';
        html += '<div class="row-b" style="margin-bottom:10px;"><span style="font-weight:600; font-size:14px;">' + dayName + ', ' + displayDate(d) + '</span><span class="mono" style="font-size:12px; color:var(--text-dim);">' + r.boxes + ' boxes</span></div>';
        html += '<div style="font-size:12px; color:var(--text-dim); line-height:1.7;">';
        html += '<div class="row-b"><span>Matrix</span><span class="mono">' + fmt(r.matrix) + '</span></div>';
        html += '<div class="row-b"><span>Booster</span><span class="mono">' + fmt(r.boost) + '</span></div>';
        if (r.pGen) html += '<div class="row-b"><span>Penalty gen</span><span class="mono">' + fmt(r.pGen) + '</span></div>';
        if (r.pPaid) html += '<div class="row-b"><span>Penalty paid</span><span class="mono">' + fmt(r.pPaid) + '</span></div>';
        html += '</div>';
        html += '<div class="div" style="margin:10px 0;"></div>';
        html += '<div class="row-b"><span style="font-size:12px; color:var(--text-dim);">Actual</span><span class="mono" style="font-weight:700;">' + fmt(actual) + '</span></div>';
        html += '</div>';
      }
    } else html += '<div class="empty">No activity yet</div>';
    html += '</div>';
    return html;
  }

    html += '<div class="card"><div class="label-lg" style="margin-bottom:14px;">Financial Summary</div>';
    html += '<div class="row-b"><span class="dim">Current level (' + state.currentLevel + ') matrix</span><span class="mono" style="font-weight:600;">' + fmt(levelBoxesSaved()) + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Archived levels matrix</span><span class="mono" style="font-weight:600;">' + fmt(archivedSaved()) + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Boosters</span><span class="mono" style="font-weight:600;">' + fmt(b) + '</span></div>';
    html += '<div class="div"></div>';
    html += '<div class="row-b"><span style="font-weight:600;">Actual saved (all-time)</span><span class="mono big" style="font-size:22px;">' + fmt(actual) + '</span></div></div>';
    html += '<div class="card"><div class="label-lg" style="margin-bottom:14px;">Levels</div>';
    html += '<div class="row-b"><span class="dim">Current level</span><span class="mono" style="font-weight:600;">' + state.currentLevel + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Completed levels</span><span class="mono" style="font-weight:600;">' + state.levels.length + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Total target</span><span class="mono" style="font-weight:600;">' + fmt(totalTarget()) + '</span></div>';
    html += '</div>';
    html += '<div class="card"><div class="label-lg" style="margin-bottom:14px;">Smart Target Breakdown</div>';
    html += '<div class="row-b"><span class="dim">Base daily need</span><span class="mono" style="font-weight:600;">' + fmt(t.baseDaily) + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Streak discount</span><span class="mono" style="font-weight:600;">' + Math.round(t.streakDiscount * 100) + '%</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Missed-day penalty</span><span class="mono" style="font-weight:600;">+' + Math.round((t.missPenaltyFactor - 1) * 100) + '%</span></div>';
    html += '<div class="div"></div>';
    html += '<div class="row-b"><span style="font-weight:600;">Today\'s target</span><span class="mono big" style="font-size:22px;">' + fmt(t.todayTarget) + '</span></div></div>';
    html += '<div class="card"><div class="label-lg" style="margin-bottom:14px;">Timeline</div>';
    html += '<div class="row-b"><span class="dim">Start</span><span class="mono" style="font-weight:600;">' + displayDate(tl.start) + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Target</span><span class="mono" style="font-weight:600;">' + displayDate(tl.target) + '</span></div>';
    if (tl.projectedFinish && validDate(tl.projectedFinish)) html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Projected</span><span class="mono" style="font-weight:600;">' + displayDate(tl.projectedFinish) + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Days left</span><span class="mono" style="font-weight:600;">' + tl.daysLeft + '</span></div>';
    html += '</div>';
    html += '<div class="card"><div class="label-lg" style="margin-bottom:14px;">Penalties</div>';
    html += '<div class="row-b"><span class="dim">Generated</span><span class="mono" style="font-weight:600;">' + fmt(pGen) + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Paid</span><span class="mono" style="font-weight:600;">' + fmt(pPaid) + '</span></div>';
    html += '<div class="row-b" style="margin-top:8px;"><span class="dim">Outstanding</span><span class="mono" style="font-weight:600;">' + fmt(out) + '</span></div></div>';
    html += '<div class="card"><div class="label-lg" style="margin-bottom:14px;">Export</div><div class="row">';
    html += '<button id="exportJson" class="btn btn-secondary" style="flex:1;">JSON</button>';
    html += '<button id="exportCsv" class="btn btn-secondary" style="flex:1;">CSV</button>';
    html += '</div></div></div>';
    return html;
  }

  function renderSettings() {
    const s = state.settings;
    let html = '<div class="stack">';
    html += renderThemeSwitcher();
    html += '<div class="card"><div class="label-lg" style="margin-bottom:16px;">Penalty</div><div class="stack-sm">';
    html += '<div class="row-b"><label class="dim" style="font-size:13px;">Starting amount</label><input id="settingStartPenalty" type="number" class="inp mono" style="width:100px; padding:8px 10px; text-align:right;" value="' + s.startPenalty + '"></div>';
    html += '<div class="row-b"><label class="dim" style="font-size:13px;">Increment</label><input id="settingPenaltyIncrement" type="number" class="inp mono" style="width:100px; padding:8px 10px; text-align:right;" value="' + s.penaltyIncrement + '"></div>';
    html += '</div></div>';
    html += '<div class="card"><div class="label-lg" style="margin-bottom:16px;">Challenge</div><div class="stack-sm">';
    html += '<div class="row-b"><label class="dim" style="font-size:13px;">Daily pace</label><input id="settingDailyPace" type="number" class="inp mono" style="width:100px; padding:8px 10px; text-align:right;" min="1" max="240" value="' + (s.dailyPace || 1) + '"></div>';
    html += '<div class="row-b"><label class="dim" style="font-size:13px;">Start date</label><input id="settingStartDate" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" class="inp mono" style="width:160px; padding:8px 10px;" value="' + displayDate(s.challengeStart) + '"></div>';
    html += '<div class="row-b"><label class="dim" style="font-size:13px;">Target date</label><input id="settingTargetDate" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" class="inp mono" style="width:160px; padding:8px 10px;" value="' + displayDate(s.targetDate) + '"></div>';
    html += '</div></div>';
    html += '<div class="card"><div class="label-lg" style="margin-bottom:6px;">Password</div><p class="dim" style="font-size:12px; margin-bottom:12px;">To change, enter current and new password.</p><div class="stack-sm">';
    html += '<input id="settingOldPassword" type="password" class="inp" placeholder="Current password" autocomplete="off">';
    html += '<input id="settingNewPassword" type="password" class="inp" placeholder="New password (min 4)" autocomplete="new-password">';
    html += '<input id="settingConfirmPassword" type="password" class="inp" placeholder="Confirm new password" autocomplete="new-password">';
    html += '<button id="changePasswordBtn" class="btn btn-secondary">Change Password</button>';
    html += '</div></div>';
    html += '<div class="card"><div class="row" style="gap:8px; flex-wrap:wrap;">';
    html += '<button id="saveSettingsBtn" class="btn btn-primary" style="flex:1;">Save</button>';
    html += '<button id="importDataBtn" class="btn btn-secondary" style="flex:1;">Import</button>';
    html += '<button id="resetChallengeBtn" class="btn btn-danger" style="flex:1;">Reset</button>';
    html += '</div><input type="file" id="importFile" accept=".json" style="display:none;"></div>';
    html += '</div>';
    return html;
  }

  let finUnlocked = false;
  let activePeriod = 'today';
  let currentTab = 'dashboard';

  function renderTab() {
    const c = document.getElementById('tabContent');
    let html = '';
    try {
      switch (currentTab) {
        case 'dashboard': html = renderDashboard(); break;
        case 'timeline': html = renderTimeline(); break;
        case 'matrix': html = renderMatrix(); break;
        case 'levels': html = renderLevels(); break;
        case 'streak': html = renderStreak(); break;
        case 'booster': html = renderBooster(); break;
        case 'penalty': html = renderPenalty(); break;
        case 'activity': html = renderActivity(); break;
        case 'reports': html = renderReports(); break;
        case 'settings': html = renderSettings(); break;
      }
      c.innerHTML = html;
      updateHeader();
      bindEvents();
    } catch (e) {
      c.innerHTML = '<div class="card"><div style="color:var(--text); font-family:monospace; font-size:12px; white-space:pre-wrap;">Render error: ' + e.message + '\n\n' + (e.stack || '') + '</div></div>';
      console.error('Render error:', e);
    }
  }

  function triggerLevelUpModal() {
    const lv = state.currentLevel - 1;
    document.getElementById('levelUpTitle').textContent = 'Level ' + lv + ' Complete!';
    document.getElementById('levelUpMsg').innerHTML = 'You saved <b>' + fmt(LEVEL_TARGET) + '</b> in Level ' + lv + '.<br>Total all-time: <b>' + fmt(totalSaved()) + '</b>.<br><br>Now starting Level ' + state.currentLevel + ' (' + lakhLabel(state.currentLevel) + ').';
    document.getElementById('levelUpModal').classList.add('show');
  }

  function bindEvents() {
    const el = function(id) { return document.getElementById(id); };

    const sw = el('themeSwitcher');
    if (sw) {
      const btns = sw.querySelectorAll('button');
      for (let i = 0; i < btns.length; i++) {
        (function(b) {
          b.onclick = function() { setTheme(b.getAttribute('data-theme-name')); };
        })(btns[i]);
      }
    }

    if (el('unlockFinBtn')) el('unlockFinBtn').onclick = function() { passwordModal(function() { finUnlocked = true; toast('Unlocked'); renderTab(); }); };
    if (el('lockFinBtn')) el('lockFinBtn').onclick = function() { finUnlocked = false; toast('Locked'); renderTab(); };

    const pills = document.querySelectorAll('.pill[data-period]');
    for (let i = 0; i < pills.length; i++) {
      (function(p) {
        p.onclick = function() { activePeriod = p.getAttribute('data-period'); renderTab(); };
      })(pills[i]);
    }

    if (el('checkNextBtn')) el('checkNextBtn').onclick = function() {
      const nb = nextBox();
      if (!nb) return;
      const p = getPace(), t = todayDone();
      if (t >= p) { toast('Daily pace limit reached'); return; }
      nb.completed = true;
      nb.timestamp = nowISO();
      toast('Saved ' + fmt(nb.value) + ' (' + (t + 1) + '/' + p + ' pace)');
      const completed = checkLevelUp();
      saveState();
      renderTab();
      if (completed) triggerLevelUpModal();
    };

    const doneBoxes = document.querySelectorAll('.m-box.done');
    for (let i = 0; i < doneBoxes.length; i++) {
      (function(box) {
        box.onclick = function() {
          const id = parseInt(box.getAttribute('data-box-id'), 10);
          let target = null;
          for (let j = 0; j < state.boxes.length; j++) if (state.boxes[j].id === id) { target = state.boxes[j]; break; }
          if (!target || !target.completed) return;
          confirmBox('Undo', 'Uncheck ' + fmt(target.value) + '?', function() {
            target.completed = false;
            target.timestamp = null;
            saveState();
            renderTab();
          });
        };
      })(doneBoxes[i]);
    }

    if (el('paceSelect')) el('paceSelect').onchange = function() {
      const np = parseInt(el('paceSelect').value, 10);
      const t = todayDone();
      if (t > np) { toast('Already ' + t + ' today'); el('paceSelect').value = getPace(); return; }
      state.settings.dailyPace = np;
      saveState();
      toast('Pace: ' + np + ' box/day');
      renderTab();
    };

    if (el('addBoosterBtn')) el('addBoosterBtn').onclick = function() {
      const amt = parseFloat(el('boosterAmount').value);
      const desc = el('boosterDesc').value.trim();
      if (!amt || amt <= 0) { toast('Invalid amount'); return; }
      const now = new Date();
      state.boosters.push({
        id: uid(), amount: Math.round(amt), date: todayStr(),
        time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'),
        description: desc, timestamp: nowISO()
      });
      saveState();
      toast('+' + fmt(amt));
      renderTab();
    };

    const delBtns = document.querySelectorAll('.delete-booster');
    for (let i = 0; i < delBtns.length; i++) {
      (function(btn) {
        btn.onclick = function() {
          const id = btn.getAttribute('data-id');
          confirmBox('Delete', 'Remove this entry?', function() {
            const next = [];
            for (let j = 0; j < state.boosters.length; j++) if (state.boosters[j].id !== id) next.push(state.boosters[j]);
            state.boosters = next;
            saveState();
            renderTab();
          });
        };
      })(delBtns[i]);
    }

    const payBtns = document.querySelectorAll('.mark-paid');
    for (let i = 0; i < payBtns.length; i++) {
      (function(btn) {
        btn.onclick = function() {
          const id = btn.getAttribute('data-id');
          for (let j = 0; j < state.penalties.length; j++) {
            if (state.penalties[j].id === id) { state.penalties[j].paid = true; state.penalties[j].paidDate = todayStr(); break; }
          }
          saveState();
          renderTab();
        };
      })(payBtns[i]);
    }

    if (el('exportJson')) el('exportJson').onclick = function() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'savings_backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Exported');
    };
    if (el('exportCsv')) el('exportCsv').onclick = function() {
      let csv = 'Date,Type,Amount,Description\n';
      function scanBoxes(boxes) {
        for (let i = 0; i < boxes.length; i++) {
          const b = boxes[i];
          if (b.completed && b.timestamp) csv += displayDate(b.timestamp.slice(0,10)) + ',Matrix,' + b.value + ',Box\n';
        }
      }
      scanBoxes(state.boxes);
      for (let L = 0; L < state.levels.length; L++) scanBoxes(state.levels[L].boxes || []);
      for (let i = 0; i < state.boosters.length; i++) {
        const b = state.boosters[i];
        csv += displayDate(b.date) + ',Booster,' + b.amount + ',' + (b.description || '').replace(/,/g, ';') + '\n';
      }
      for (let i = 0; i < state.penalties.length; i++) {
        const p = state.penalties[i];
        csv += displayDate(p.date) + ',Penalty,' + p.amount + ',' + (p.paid ? 'Paid' : 'Unpaid') + '\n';
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'savings_export.csv';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Exported');
    };

    if (el('saveSettingsBtn')) el('saveSettingsBtn').onclick = function() {
      const sp = parseInt(el('settingStartPenalty').value, 10);
      const pi = parseInt(el('settingPenaltyIncrement').value, 10);
      const dp = parseInt(el('settingDailyPace').value, 10);
      const sd = el('settingStartDate').value;
      const td = el('settingTargetDate').value;
      if (sp > 0) state.settings.startPenalty = sp;
      if (pi > 0) state.settings.penaltyIncrement = pi;
      if (dp > 0) {
        if (todayDone() > dp) { toast("Can't be below " + todayDone()); return; }
        state.settings.dailyPace = dp;
      }
      if (sd) { const iso = parseDisplayDate(sd); if (!iso) { toast('Start date must be DD/MM/YYYY'); return; } state.settings.challengeStart = iso; }
      if (td) { const iso = parseDisplayDate(td); if (!iso) { toast('Target date must be DD/MM/YYYY'); return; } state.settings.targetDate = iso; }
      saveState();
      toast('Saved');
      renderTab();
    };

    if (el('changePasswordBtn')) el('changePasswordBtn').onclick = function() {
      const oldPw = el('settingOldPassword').value;
      const nwPw = el('settingNewPassword').value;
      const cfPw = el('settingConfirmPassword').value;
      if (hashStr(oldPw) !== state.settings.passwordHash) { toast('Current password incorrect'); return; }
      if (nwPw.length < 4) { toast('Password 4+ chars required'); return; }
      if (nwPw !== cfPw) { toast('Passwords do not match'); return; }
      state.settings.passwordHash = hashStr(nwPw);
      saveState();
      toast('Password changed');
      renderTab();
    };

    if (el('resetChallengeBtn')) el('resetChallengeBtn').onclick = function() {
      confirmBox('Reset', 'Erase all data including all levels?', function() { storageRemove(STORAGE_KEY); location.reload(); });
    };

    if (el('importDataBtn')) el('importDataBtn').onclick = function() { el('importFile').click(); };
    if (el('importFile')) el('importFile').onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function(ev) {
        try {
          const p = JSON.parse(ev.target.result);
          if (p.version === 3 && Array.isArray(p.boxes) && p.boxes.length === TOTAL_BOXES) {
            state = p;
            state.settings = Object.assign({}, DEFAULT_SETTINGS, state.settings || {});
            if (!state.settings.passwordHash) state.settings.passwordHash = hashStr(DEFAULT_PASSWORD);
            if (!Array.isArray(state.boosters)) state.boosters = [];
            if (!Array.isArray(state.penalties)) state.penalties = [];
            if (!Array.isArray(state.missedDates)) state.missedDates = [];
            if (!Array.isArray(state.levels)) state.levels = [];
            if (typeof state.currentLevel !== 'number' || state.currentLevel < 1) state.currentLevel = 1;
            saveState();
            toast('Imported');
            renderTab();
          } else toast('Invalid file');
        } catch (e) { toast('Invalid JSON'); }
      };
      r.readAsText(file);
    };
  }

  document.getElementById('confirmYes').onclick = function() {
    document.getElementById('confirmModal').classList.remove('show');
    if (confirmCallback) { const cb = confirmCallback; confirmCallback = null; cb(); }
  };
  document.getElementById('confirmNo').onclick = function() {
    document.getElementById('confirmModal').classList.remove('show');
    confirmCallback = null;
  };

  document.getElementById('levelUpContinue').onclick = function() {
    document.getElementById('levelUpModal').classList.remove('show');
    renderTab();
  };

  function checkPw(entered) { return hashStr(entered) === state.settings.passwordHash; }
  function passwordModal(onSuccess) {
    const modal = document.getElementById('passwordModal');
    const input = document.getElementById('passwordInput');
    const err = document.getElementById('passwordError');
    input.value = ''; err.style.display = 'none';
    modal.classList.add('show');
    setTimeout(function() { try { input.focus(); } catch(e){} }, 100);
    function submit() {
      if (checkPw(input.value)) { modal.classList.remove('show'); if (onSuccess) onSuccess(); }
      else { err.style.display = 'block'; input.value = ''; input.focus(); }
    }
    document.getElementById('passwordSubmit').onclick = submit;
    document.getElementById('passwordCancel').onclick = function() { modal.classList.remove('show'); };
    input.onkeydown = function(e) {
      if (e.key === 'Enter') submit();
      else if (e.key === 'Escape') modal.classList.remove('show');
    };
  }

  function checkPenaltyPopup() {
    const t = todayStr();
    if (state.lastPenaltyPopupDate === t) return;
    const unpaid = [];
    for (let i = 0; i < state.penalties.length; i++) if (!state.penalties[i].paid) unpaid.push(state.penalties[i]);
    if (!unpaid.length) return;
    const latest = unpaid[unpaid.length - 1];
    document.getElementById('penaltyModalText').innerHTML = 'You missed <b>' + displayDate(latest.date) + '</b>. Penalty: <b>' + fmt(latest.amount) + '</b>.';
    document.getElementById('penaltyModal').classList.add('show');
    state.lastPenaltyPopupDate = t;
    saveState();
    document.getElementById('penaltyPayBtn').onclick = function() {
      latest.paid = true; latest.paidDate = t; saveState();
      document.getElementById('penaltyModal').classList.remove('show');
      toast('Penalty paid: ' + fmt(latest.amount));
      renderTab();
    };
    document.getElementById('penaltyLaterBtn').onclick = function() {
      document.getElementById('penaltyModal').classList.remove('show');
    };
  }

  function setupNav() {
    const btns = document.querySelectorAll('#mainNav button');
    for (let i = 0; i < btns.length; i++) {
      (function(btn) {
        btn.onclick = function() {
          for (let j = 0; j < btns.length; j++) btns[j].classList.remove('active');
          btn.classList.add('active');
          currentTab = btn.getAttribute('data-tab');
          renderTab();
        };
      })(btns[i]);
    }
  }

  function boot() {
    try {
      loadTheme();
      if (!storageOK) toast('⚠️ Storage unavailable — data will not persist');
      loadState();
      reconcileMissedDays();
      const completed = checkLevelUp();
      saveState();
      setupNav();
      renderTab();
      if (completed) triggerLevelUpModal();
      setTimeout(function() { try { checkPenaltyPopup(); } catch (e) { console.warn('penalty:', e); } }, 800);
    } catch (e) {
      showFatal('Boot error: ' + e.message + '\n\n' + (e.stack || ''));
      console.error('Boot error:', e);
    }
  }

  boot();
})();
</script>
</body>
</html>
